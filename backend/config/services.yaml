# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    wave.s3_client:
        class: Aws\S3\S3Client
        arguments:
            - version: 'latest'
              region: '%env(S3_REGION)%'
              endpoint: '%env(S3_ENDPOINT)%'
              use_path_style_endpoint: '%env(bool:S3_USE_PATH_STYLE)%'
              credentials:
                  key: '%env(S3_ACCESS_KEY)%'
                  secret: '%env(S3_SECRET_KEY)%'

    App\Storage\ObjectStorage: '@App\Storage\FlysystemObjectStorage'

    App\Search\SearchProvider: '@App\Search\PostgresSearchProvider'

    # ADR 011: phase 3 ranker; W-40 rebinds this alias to SqlFeedRanker.
    App\Feed\FeedRanker: '@App\Feed\SimpleFeedRanker'

    # DeduplicateStamp keys travel with the message, so the store must be serializable and
    # shared by php and workers: Doctrine DBAL table `lock_keys` (flock/advisory locks are not).
    wave.dedup_lock_store:
        class: Symfony\Component\Lock\Store\DoctrineDbalStore
        arguments: ['@doctrine.dbal.default_connection']
    wave.dedup_lock_factory:
        class: Symfony\Component\Lock\LockFactory
        arguments: ['@wave.dedup_lock_store']
    messenger.middleware.deduplicate_middleware:
        class: Symfony\Component\Messenger\Middleware\DeduplicateMiddleware
        arguments: ['@wave.dedup_lock_factory']

when@test:
    services:
        App\Tests\Support\QueryCounter:
            tags: ['doctrine.middleware']
