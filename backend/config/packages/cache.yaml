framework:
    cache:
        prefix_seed: wave/backend
        pools:
            # Shared by every FPM worker (CONVENTIONS §9): rate limiter state lives in Postgres.
            cache.rate_limiter:
                adapter: cache.adapter.doctrine_dbal
            # GET /admin/dashboard counters (60 s, ADR 013); per-FPM-worker staleness is acceptable.
            cache.admin_dashboard:
                adapter: cache.app
            # ADR 014: external catalogue cache, shared by FPM workers (search/chart 1 h, artist
            # metadata 24 h, top tracks 10 min). Nothing stored in tables; pruned daily by the
            # scheduler's `cache:pool:prune` (WaveSchedule).
            cache.catalog:
                adapter: cache.adapter.doctrine_dbal
            # GET /discover global parts (W-87): trending/genres/hashtags 15 min, new tracks 5 min;
            # ids and small scalars only, per-FPM-worker staleness is acceptable.
            cache.discover:
                adapter: cache.app

when@test:
    framework:
        cache:
            pools:
                # In-memory: each test kernel starts with an empty cache.
                cache.admin_dashboard:
                    adapter: cache.adapter.array
                cache.catalog:
                    adapter: cache.adapter.array
                cache.discover:
                    adapter: cache.adapter.array
