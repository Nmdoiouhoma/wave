api_platform:
    title: Wave API
    version: 1.0.0
    # Plain JSON only: no Hydra / JSON-LD (CONVENTIONS §2).
    formats:
        json: ['application/json']
    patch_formats:
        json: ['application/merge-patch+json', 'application/json']
    error_formats:
        jsonproblem: ['application/problem+json']
    docs_formats:
        json: ['application/json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    enable_docs: false
    enable_entrypoint: false
    enable_swagger: false
    enable_swagger_ui: false
    enable_re_doc: false
    mapping:
        paths: ['%kernel.project_dir%/src/ApiResource']
    defaults:
        stateless: true
        pagination_enabled: false
        # Input is decoded by App\Http\JsonInputDecoder inside processors so that every
        # endpoint (API Platform or controller) shares one error mapping. `deserialize`
        # cannot be a global default: write operations declare `deserialize: false`.
        validate: false
        normalization_context:
            skip_null_values: false
        extra_properties:
            standard_put: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    serializer:
        hydra_prefix: false

when@dev:
    api_platform:
        enable_docs: true
        enable_swagger: true
        enable_swagger_ui: true
