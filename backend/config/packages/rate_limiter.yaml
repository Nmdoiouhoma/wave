# Limits from the x-rate-limit annotations of docs/openapi.yaml.
# Route → limiter mapping lives in App\RateLimit\RateLimitListener.
framework:
    rate_limiter:
        register_ip: { policy: sliding_window, limit: 5, interval: '1 hour', cache_pool: cache.rate_limiter }
        login_ip_email: { policy: sliding_window, limit: 5, interval: '1 minute', cache_pool: cache.rate_limiter }
        login_ip: { policy: sliding_window, limit: 20, interval: '15 minutes', cache_pool: cache.rate_limiter }
        refresh_ip: { policy: sliding_window, limit: 30, interval: '1 minute', cache_pool: cache.rate_limiter }
        account_token_verify_ip: { policy: sliding_window, limit: 10, interval: '1 minute', cache_pool: cache.rate_limiter }
        account_token_reset_ip: { policy: sliding_window, limit: 10, interval: '15 minutes', cache_pool: cache.rate_limiter }
        password_reset_email: { policy: sliding_window, limit: 3, interval: '1 hour', cache_pool: cache.rate_limiter }
        password_reset_ip: { policy: sliding_window, limit: 10, interval: '1 hour', cache_pool: cache.rate_limiter }
        verification_resend_user: { policy: sliding_window, limit: 3, interval: '1 hour', cache_pool: cache.rate_limiter }
        password_change_user: { policy: sliding_window, limit: 5, interval: '15 minutes', cache_pool: cache.rate_limiter }
        image_upload_user: { policy: sliding_window, limit: 30, interval: '1 hour', cache_pool: cache.rate_limiter }
        track_upload_hour_user: { policy: sliding_window, limit: 10, interval: '1 hour', cache_pool: cache.rate_limiter }
        track_upload_day_user: { policy: sliding_window, limit: 30, interval: '1 day', cache_pool: cache.rate_limiter }
        stream_url_user: { policy: sliding_window, limit: 120, interval: '1 minute', cache_pool: cache.rate_limiter }
