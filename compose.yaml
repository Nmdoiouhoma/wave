# Wave — base stack (prod-shaped). Dev additions live in compose.override.yaml,
# which `docker compose` merges automatically; prod runs `-f compose.yaml` only
# (no mailpit, no Vite, no bind mounts).
#
# Only nginx publishes a port. postgres, minio, php and the workers sit on the
# `internal` network, which has no route out of the host (ADR 006).

name: wave

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

# Variables of CONVENTIONS §9 used by php and the workers.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:?}
  APP_SECRET: ${APP_SECRET:?}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:?}
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?}
  FRONT_PUBLIC_URL: ${FRONT_PUBLIC_URL:?}
  DATABASE_URL: ${DATABASE_URL:?}
  MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:?}
  LOCK_DSN: ${LOCK_DSN:?}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?}
  JWT_PASSPHRASE: ${JWT_PASSPHRASE:?}
  JWT_TTL: ${JWT_TTL:?}
  REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:?}
  REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:?}
  STREAM_SIGNING_KEY: ${STREAM_SIGNING_KEY:?}
  STREAM_URL_TTL: ${STREAM_URL_TTL:?}
  S3_ENDPOINT: ${S3_ENDPOINT:?}
  S3_REGION: ${S3_REGION:?}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:?}
  S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:?}
  S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:?}
  MAILER_DSN: ${MAILER_DSN:?}
  MAILER_FROM: ${MAILER_FROM:?}
  CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:?}
  PHP_OPCACHE_VALIDATE_TIMESTAMPS: ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-0}

x-worker: &worker
  <<: *hardening
  build:
    context: .
    dockerfile: infra/php/Dockerfile
    target: worker
  image: wave/worker:local
  environment:
    <<: *app-env
    FFMPEG_BIN: /usr/bin/ffmpeg
    FFPROBE_BIN: /usr/bin/ffprobe
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  networks: [internal]
  depends_on:
    postgres: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }

services:
  php:
    <<: *hardening
    build:
      context: .
      dockerfile: infra/php/Dockerfile
      target: php
    image: wave/php:local
    environment: *app-env
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 512M }
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  # ffmpeg jobs: transport `media`, concurrency 2 (CONVENTIONS §8).
  worker:
    <<: *worker
    command: ["media"]
    deploy:
      replicas: 2
      resources:
        limits: { memory: 1G }

  # Everything else + the scheduler. Exactly one replica: the scheduler
  # transport must have a single consumer.
  worker-async:
    <<: *worker
    command: ["async", "scheduler_default"]
    deploy:
      replicas: 1
      resources:
        limits: { memory: 512M }

  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    ports:
      - "${WAVE_HTTP_PORT:-8090}:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - ./infra/nginx/snippets/front-static.conf:/etc/nginx/wave/front.conf:ro
      - nginx_cache:/var/cache/nginx
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [internal, edge]
    deploy:
      resources:
        limits: { memory: 128M }
    depends_on:
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    <<: *hardening
    image: postgres:16.15-alpine3.24
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql:uid=70,gid=70,mode=0775
    shm_size: 128m
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 1G }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # Community build of MinIO (the minio/minio images are no longer published
  # on Docker Hub / quay.io anonymously).
  minio:
    <<: *hardening
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BROWSER: "off"
      MINIO_UPDATE: "off"
    volumes:
      - minio_data:/data
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 512M }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: buckets, bucket policies (ADR 001 §5), application user.
  minio-init:
    <<: *hardening
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: "no"
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:?}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:?}
      WAVE_INTERNAL_SUBNET: ${WAVE_INTERNAL_SUBNET:-172.30.90.0/24}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    networks: [internal]
    depends_on:
      minio: { condition: service_healthy }

networks:
  internal:
    internal: true
    ipam:
      config:
        - subnet: ${WAVE_INTERNAL_SUBNET:-172.30.90.0/24}
  edge: {}

volumes:
  postgres_data:
  minio_data:
  nginx_cache:
