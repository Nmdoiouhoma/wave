# Wave — base stack (prod-shaped). Dev additions live in compose.override.yaml,
# which `docker compose` merges automatically; prod runs `-f compose.yaml` only
# (no mailpit, no Vite, no bind mounts): php/worker images contain the app
# (composer --no-dev, warmed cache), nginx contains the built SPA.
# Every third-party image is pinned by version AND digest (ADR 006, F8).
#
# Only nginx publishes a port. postgres, minio, php and the workers sit on the
# `internal` network, which has no route out of the host (ADR 006).

name: wave

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

# Variables of CONVENTIONS §9 used by php and the workers.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:?}
  APP_SECRET: ${APP_SECRET:?}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:?}
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?}
  FRONT_PUBLIC_URL: ${FRONT_PUBLIC_URL:?}
  DATABASE_URL: ${DATABASE_URL:?}
  MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:?}
  LOCK_DSN: ${LOCK_DSN:?}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?}
  JWT_PASSPHRASE: ${JWT_PASSPHRASE:?}
  JWT_TTL: ${JWT_TTL:?}
  REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:?}
  REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:?}
  STREAM_SIGNING_KEY: ${STREAM_SIGNING_KEY:?}
  STREAM_URL_TTL: ${STREAM_URL_TTL:?}
  S3_ENDPOINT: ${S3_ENDPOINT:?}
  S3_REGION: ${S3_REGION:?}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:?}
  S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:?}
  S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:?}
  MAILER_DSN: ${MAILER_DSN:?}
  MAILER_FROM: ${MAILER_FROM:?}
  CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES-}
  PHP_OPCACHE_VALIDATE_TIMESTAMPS: ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-0}
  # Browser-facing base URL of presigned POSTs (ADR 009). Dev: nginx proxy
  # /upload; prod: the public S3 endpoint.
  S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:?}

x-worker: &worker
  <<: *hardening
  build:
    context: .
    dockerfile: infra/php/Dockerfile
    target: worker
  image: wave/worker:${WAVE_IMAGE_TAG:-local}
  environment:
    <<: *app-env
    FFMPEG_BIN: /usr/bin/ffmpeg
    FFPROBE_BIN: /usr/bin/ffprobe
    # Disk-backed (never tmpfs: a 200 MB MP4 + output must not count against
    # the 1G memory limit). ADR 009.
    MEDIA_TMP_DIR: ${MEDIA_TMP_DIR:-/var/tmp/wave-media}
  read_only: true
  tmpfs:
    # Small: media temp files live on the media_tmp disk volume (MEDIA_TMP_DIR).
    - /tmp:size=64m,mode=1777
    # Runtime state of the read-only app image: cache.app pools (scheduler
    # checkpoint...) and logs. Per container, not shared.
    - /app/var/share:size=64m,uid=33,gid=33,mode=0755
    - /app/var/log:size=16m,uid=33,gid=33,mode=0755
  networks: [internal]
  depends_on:
    postgres: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }

services:
  php:
    <<: *hardening
    build:
      context: .
      dockerfile: infra/php/Dockerfile
      target: php
    image: wave/php:${WAVE_IMAGE_TAG:-local}
    environment: *app-env
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/var/share:size=64m,uid=33,gid=33,mode=0755
      - /app/var/log:size=16m,uid=33,gid=33,mode=0755
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 512M }
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  # ffmpeg jobs: transport `media`, concurrency 2 (CONVENTIONS §8).
  worker:
    <<: *worker
    command: ["media"]
    # Shared by the 2 replicas (random file names). Peak ~ 2 x (200 MB source
    # + ~15 MB output): keep >= 2 GB free on the Docker disk (CONVENTIONS §9).
    volumes:
      - media_tmp:${MEDIA_TMP_DIR:-/var/tmp/wave-media}
    deploy:
      replicas: 2
      resources:
        limits: { memory: 1G }

  # Everything else + the scheduler. Exactly one replica: the scheduler
  # transport must have a single consumer.
  worker-async:
    <<: *worker
    command: ["async", "scheduler_default"]
    deploy:
      replicas: 1
      resources:
        limits: { memory: 512M }

  nginx:
    <<: *hardening
    # Prod image: configs + built SPA (infra/nginx/Dockerfile, target nginx).
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      target: nginx
    image: wave/nginx:${WAVE_IMAGE_TAG:-local}
    ports:
      - "${WAVE_HTTP_PORT:-8090}:8080"
    volumes:
      - nginx_cache:/var/cache/nginx
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      internal: {}
      edge: {}
      # Fixed address: the only anonymous reader of wave-private/audio (F5).
      storage:
        ipv4_address: ${WAVE_NGINX_STORAGE_IP:-172.30.91.10}
    deploy:
      resources:
        limits: { memory: 128M }
    depends_on:
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    <<: *hardening
    image: postgres:16.15-alpine3.24@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql:uid=70,gid=70,mode=0775
    shm_size: 128m
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 1G }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # DEV ONLY (F8): community build of MinIO (`pgsty/minio`; upstream images
  # are no longer published anonymously). Prod must use managed S3 (S3_* env
  # vars, ADR 003) or a MinIO image built from upstream sources in-house.
  minio:
    <<: *hardening
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BROWSER: "off"
      MINIO_UPDATE: "off"
      # Prod-like rule of ADR 009: only the front origin may POST cross-origin
      # (dev is same-origin through nginx /upload, so this is a no-op there).
      MINIO_API_CORS_ALLOW_ORIGIN: ${FRONT_PUBLIC_URL:?}
    volumes:
      - minio_data:/data
    networks:
      internal:
        # Used by nginx /upload/wave-private: requests arrive from nginx's
        # `internal` address, which has NO anonymous read (only `storage` has).
        aliases: [minio-internal]
      # nginx reaches MinIO only through this network, as `minio-edge`, so its
      # requests come from WAVE_NGINX_STORAGE_IP (bucket policy condition).
      storage:
        aliases: [minio-edge]
    deploy:
      resources:
        limits: { memory: 512M }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: buckets, bucket policies (ADR 001 §5), application user.
  minio-init:
    <<: *hardening
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: "no"
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:?}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:?}
      WAVE_NGINX_STORAGE_IP: ${WAVE_NGINX_STORAGE_IP:-172.30.91.10}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    networks: [internal]
    depends_on:
      minio: { condition: service_healthy }

networks:
  internal:
    internal: true
    ipam:
      config:
        - subnet: ${WAVE_INTERNAL_SUBNET:-172.30.90.0/24}
  # nginx <-> minio only (F5).
  storage:
    internal: true
    ipam:
      config:
        - subnet: ${WAVE_STORAGE_SUBNET:-172.30.91.0/24}
  edge: {}

volumes:
  media_tmp:
  postgres_data:
  minio_data:
  nginx_cache:
