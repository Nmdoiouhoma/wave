openapi: 3.1.0
info:
  title: Wave API
  version: 1.0.0
  summary: Social music API (library, player, vertical feed).
  description: |
    Contract v1. Owned by architect; any change goes through architect (BRIEF).

    Global rules (details in docs/CONVENTIONS.md):
    - Base path `/api/v1`. JSON only (`application/json`), camelCase, no Hydra/JSON-LD.
    - Ids are UUID v7 strings, except genres (slug), users in paths (username), artists in paths (slug), hashtags (name).
    - Dates are ISO 8601 UTC with `Z` (`2026-10-24T08:15:30Z`).
    - Errors are RFC 7807 `application/problem+json` with a stable `code` (see `ProblemCode`); `type` = `urn:wave:problem:{code}`.
    - Lists use cursor pagination: `?cursor=&limit=` (limit default 20, max 50 unless stated); response `{items, nextCursor}`; `nextCursor: null` = last page. Cursors are opaque; a tampered cursor → 400 `invalid_cursor`.
    - Every endpoint requires `Authorization: Bearer <access JWT>` unless it declares `security: []`. Access JWT TTL 15 min.
    - Visibility: a resource the caller may not see (private track/playlist of someone else, hidden by moderation, not ready and not owned, non-playable post) answers **404 `not_found`**, never 403. 403 is only for resources the caller can see but may not mutate.
    - Rate-limited routes declare `x-rate-limit` and may answer 429 with `Retry-After` (seconds).
    - Unverified accounts (`emailVerified: false`) may browse, stream, like, follow, manage playlists; operations tagged `x-requires-verified-email: true` answer 403 `email_not_verified` for them.
    - Unsupported method on an existing path (405) is answered as 404 `not_found`, so the route map is not disclosed.
    - Body with a missing required field or wrong JSON type → 400 `malformed_request` on auth routes (`/auth/*`, deserialized before validation); 422 `validation_failed` elsewhere.
    - An `artistId` (or any referenced id) the caller does not own or cannot see → 404 `not_found`, in bodies as in paths.
    - PATCH bodies are partial JSON (merge-patch semantics); `application/json` and `application/merge-patch+json` are both accepted.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: me
  - name: users
  - name: artists
  - name: genres
  - name: tracks
  - name: stream
  - name: playlists
  - name: posts
  - name: feed
  - name: search
  - name: reports
  - name: admin

paths:
  # ───────────────────────────── auth ─────────────────────────────
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account and open a session
      security: []
      x-rate-limit: 5 per hour per IP
      parameters:
        - $ref: '#/components/parameters/WaveClient'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          $ref: '#/components/responses/AuthSession'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password
      description: Wrong email or password both answer 401 `invalid_credentials` (no user enumeration). Missing `email`/`password` or non-string value → 400 `malformed_request`. Suspended account → 403 `account_suspended`.
      security: []
      x-rate-limit: 5 per minute per IP+email; 20 per 15 minutes per IP
      parameters:
        - $ref: '#/components/parameters/WaveClient'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate the refresh token and get a new access token
      description: |
        Web (no `X-Wave-Client: mobile`): refresh token read from the `wave_refresh` cookie, body ignored; new cookie set.
        Mobile (`X-Wave-Client: mobile`): refresh token read from the body; new token returned in the body; no cookie.
        Tokens are single-use and rotate within a **family** (one family = one login session, ADR 008).
        Unknown or expired → 401 `refresh_token_invalid`. An already-rotated token (reuse, i.e. probable theft) → the **whole family is revoked** (every descendant, so the legitimate holder is logged out too) and 401 `token_reused`. Web: cookie cleared in both cases.
      security: []
      x-rate-limit: 30 per minute per IP
      parameters:
        - $ref: '#/components/parameters/WaveClient'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current refresh token
      description: Idempotent. Reads the token like `/auth/refresh`; deletes it if found; web clears the cookie (`Max-Age=0`). Always 204.
      security: []
      parameters:
        - $ref: '#/components/parameters/WaveClient'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204':
          description: Logged out.
          headers:
            Set-Cookie:
              description: Web only, clears `wave_refresh`.
              schema: { type: string }

  /auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm email ownership with the emailed token
      description: 'Token from the link `{FRONT_PUBLIC_URL}/verify-email?token=…` (the front page posts it here). Unknown, expired or used → 400 `account_token_invalid`. Already verified with a valid token → 204 (idempotent).'
      security: []
      x-rate-limit: 10 per minute per IP (bucket `verify_email`, separate from reset confirm)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountTokenRequest' }
      responses:
        '204': { description: Email verified. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a password reset email
      description: |
        Anti-enumeration: always 202 with an empty body, whether the email exists, is suspended or not. The request only dispatches `SendPasswordResetEmail{email}`; the worker looks the user up, issues the token (TTL 1 h) and sends the mail, so response time does not depend on existence.
      security: []
      x-rate-limit: 3 per hour per email (normalized lowercase) and 10 per hour per IP (bucket `password_reset`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202': { description: Accepted (always). }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Set a new password with the emailed token
      description: Token from `{FRONT_PUBLIC_URL}/reset-password?token=…`. Sets the password, marks the email verified if it was not, revokes every refresh token. Does not open a session (client then logs in). Bad token → 400 `account_token_invalid`.
      security: []
      x-rate-limit: 10 per 15 minutes per IP (bucket `password_reset_confirm`, separate from verify-email)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── me ─────────────────────────────
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Get me
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Update me
      description: Username and email are immutable in v1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [me]
      operationId: deleteMe
      summary: Delete my account (GDPR erasure)
      description: |
        Hard delete of the account and everything it authored (DATA_MODEL §13b, ADR 007), including other users' posts made from my tracks. Irreversible.
        Requires the current password (wrong → 422 `validation_failed` on `password`). Revokes all sessions; web cookie cleared. A confirmation email is sent to the former address.
      x-rate-limit: 5 per 15 minutes per user (bucket `account_delete`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204':
          description: Account deleted.
          headers:
            Set-Cookie:
              description: Web only, clears `wave_refresh`.
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/email-verification:
    post:
      tags: [me]
      operationId: resendEmailVerification
      summary: Send a new verification email
      description: Invalidates previous unused verification tokens, issues a new one (TTL 24 h) asynchronously. Already verified → 409 `email_already_verified`.
      x-rate-limit: 3 per hour per user (bucket `verification_resend`)
      responses:
        '202': { description: Email queued. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/password:
    post:
      tags: [me]
      operationId: changePassword
      summary: Change password
      description: |
        Revokes the refresh-token families of every **other** session (identified by the `sid` claim of the access JWT); the current session survives and is rotated: the response carries a new access token and a new refresh token (cookie on web, body on mobile), exactly like `/auth/refresh`.
        Wrong current password → 422 `validation_failed` on `currentPassword`. (Password **reset** confirm, by contrast, revokes all sessions.)
      x-rate-limit: 5 per 15 minutes per user
      parameters:
        - $ref: '#/components/parameters/WaveClient'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/avatar:
    post:
      tags: [me]
      operationId: uploadMyAvatar
      x-requires-verified-email: true
      summary: Upload my avatar
      description: Async. Returns 202 with the user unchanged; `avatarUrl` switches when processing succeeds. Invalid image (detected by worker) is dropped silently and the previous avatar is kept.
      x-rate-limit: 30 image uploads per hour per user (shared bucket `image_upload`)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImageUpload' }
            encoding:
              file: { contentType: 'image/jpeg, image/png, image/webp' }
      responses:
        '202':
          description: Accepted for processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [me]
      operationId: deleteMyAvatar
      summary: Delete my avatar
      responses:
        '204': { description: Avatar removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/likes/tracks:
    get:
      tags: [me]
      operationId: listMyLikedTracks
      summary: List my liked tracks
      description: Ordered by like date desc. Tracks no longer visible to me are omitted.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of tracks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/likes/playlists:
    get:
      tags: [me]
      operationId: listMyLikedPlaylists
      summary: List my liked playlists
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of playlists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── users ─────────────────────────────
  /users/{username}:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [users]
      operationId: getUserProfile
      summary: Get user profile
      responses:
        '200':
          description: Public profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{username}/followers:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [users]
      operationId: listFollowers
      summary: List followers
      description: Ordered by follow date desc.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{username}/following:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [users]
      operationId: listFollowing
      summary: List following
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{username}/follow:
    parameters:
      - $ref: '#/components/parameters/Username'
    put:
      tags: [users]
      operationId: followUser
      summary: Follow user
      description: Idempotent. Following yourself → 422 `cannot_follow_self`.
      x-rate-limit: 200 per hour per user (shared bucket `social_write`)
      responses:
        '200':
          description: Follow state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [users]
      operationId: unfollowUser
      summary: Unfollow user
      description: Idempotent.
      responses:
        '200':
          description: Follow state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{username}/tracks:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [users]
      operationId: listUserTracks
      summary: List user tracks
      description: All artists of the user, newest first. Others see public-visible tracks only; the owner sees every own track (any status/visibility/moderation).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of tracks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{username}/posts:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [users]
      operationId: listUserPosts
      summary: List user posts
      description: Newest first. Others see playable posts only; the author sees all own posts.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of posts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{username}/playlists:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [users]
      operationId: listUserPlaylists
      summary: List user playlists
      description: Newest first. Others see public, visible playlists only; the owner sees all own playlists.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of playlists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{username}/artists:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [users]
      operationId: listUserArtists
      summary: List user artists
      description: Artists managed by the user (max 10, not paginated), oldest first. Hidden artists only for the owner.
      responses:
        '200':
          description: Artists.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Artist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── artists ─────────────────────────────
  /artists:
    post:
      tags: [artists]
      operationId: createArtist
      x-requires-verified-email: true
      summary: Create artist
      description: Slug is generated from the name and is immutable. More than 10 artists → 409 `artist_limit_reached`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateArtistRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /artists/{slug}:
    parameters:
      - $ref: '#/components/parameters/ArtistSlug'
    get:
      tags: [artists]
      operationId: getArtist
      summary: Get artist
      responses:
        '200':
          description: Artist page header.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [artists]
      operationId: updateArtist
      x-requires-verified-email: true
      summary: Update artist
      description: Owner only (403 `forbidden` otherwise). Renaming does not change the slug.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateArtistRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [artists]
      operationId: deleteArtist
      summary: Delete artist
      description: Owner only. Artist with any track (any status) → 409 `artist_has_tracks`.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /artists/{slug}/avatar:
    parameters:
      - $ref: '#/components/parameters/ArtistSlug'
    post:
      tags: [artists]
      operationId: uploadArtistAvatar
      x-requires-verified-email: true
      summary: Upload artist avatar
      description: Owner only. Async, same semantics as `POST /me/avatar`.
      x-rate-limit: shared bucket `image_upload`
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImageUpload' }
            encoding:
              file: { contentType: 'image/jpeg, image/png, image/webp' }
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [artists]
      operationId: deleteArtistAvatar
      summary: Delete artist avatar
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /artists/{slug}/tracks:
    parameters:
      - $ref: '#/components/parameters/ArtistSlug'
    get:
      tags: [artists]
      operationId: listArtistTracks
      summary: List artist tracks
      description: Newest first. Same visibility rule as `/users/{username}/tracks`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of tracks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── genres ─────────────────────────────
  /genres:
    get:
      tags: [genres]
      operationId: listGenres
      summary: List genres
      description: 'Fixed list of 45 genres (French names), ordered by `position`, not paginated. Cacheable (`Cache-Control: public, max-age=86400`).'
      security: []
      responses:
        '200':
          description: Genres.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Genre' }

  # ───────────────────────────── tracks ─────────────────────────────
  /tracks/uploads:
    post:
      tags: [tracks]
      operationId: createTrackUpload
      x-requires-verified-email: true
      summary: Open a direct-to-storage upload for an audio file
      description: |
        Step 1 of the only track upload flow (ADR 009). Declares the file; returns a **presigned S3 POST** (form policy) valid 15 min, bound to the caller, writing to `quarantine/uploads/{userId}/{uploadId}`.
        The policy enforces `content-length-range` [1, `maxBytes`] and the exact key; the browser sends `multipart/form-data` with every `fields` entry first and the file last (field `file`) to `url`. Storage answers 204.
        Limits by declared extension: `.mp4` → 200 MB (209715200 bytes); `.mp3`, `.m4a`, `.aac` → 30 MB (31457280 bytes). `declaredSize` above the limit → 413; other extension/MIME → 415.
        Declared values are a pre-filter only: the worker re-checks container, codec, size and duration with ffprobe.
        At most 10 pending uploads per user (409 `too_many_pending_uploads`).
      x-rate-limit: 30 per hour and 100 per day per user (bucket `track_upload`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTrackUploadRequest' }
      responses:
        '201':
          description: Upload slot created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackUploadSlot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /tracks:
    post:
      tags: [tracks]
      operationId: createTrack
      x-requires-verified-email: true
      summary: Create a track from a completed upload
      description: |
        Step 2 (ADR 009). JSON body with the `uploadId` of step 1 and the metadata. Returns 202 with `status: processing`.
        Upload checks: not the caller's or unknown → 404; already used → 409 `upload_already_used`; older than 2 h → 409 `upload_expired`; object absent in storage → 409 `upload_incomplete`. The upload is consumed atomically (single use).
        The worker validates with ffprobe (audio stream present, MP3/AAC codec, ≤ 10 min, non-MP4 containers ≤ 30 MB, MP4 ≤ 200 MB; any video stream is discarded) then sets `ready` or `failed` + `failureReason`; clients poll `GET /tracks/{id}` (every 3 s, stop after 10 min).
        Artist resolution: `artistId` given → must be owned (else 404); omitted and user owns 0 artists → one is auto-created from `displayName`; omitted and exactly 1 → that one; omitted and several → 422 `artist_required`.
        Several files = several upload/create pairs in parallel (no batch endpoint). Cover is uploaded separately (`POST /tracks/{id}/cover`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTrackRequest' }
      responses:
        '202':
          description: Accepted, processing.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /tracks/{trackId}:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [tracks]
      operationId: getTrack
      summary: Get track
      responses:
        '200':
          description: Track.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tracks]
      operationId: updateTrack
      summary: Update track
      description: Owner only. `artistId` must be another artist owned by the caller, else 404 `not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTrackRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [tracks]
      operationId: deleteTrack
      summary: Delete track
      description: Owner only. Cascades to playlist items, likes, listens and every post using the track (including other users' posts); media purged asynchronously.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tracks/{trackId}/cover:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    post:
      tags: [tracks]
      operationId: uploadTrackCover
      x-requires-verified-email: true
      summary: Upload track cover
      description: Owner only. Async (202), same semantics as `POST /me/avatar`.
      x-rate-limit: shared bucket `image_upload`
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImageUpload' }
            encoding:
              file: { contentType: 'image/jpeg, image/png, image/webp' }
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [tracks]
      operationId: deleteTrackCover
      summary: Delete track cover
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tracks/{trackId}/stream-url:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [tracks, stream]
      operationId: getTrackStreamUrl
      summary: Get track stream url
      description: 'Access check (track visible to caller) then a signed URL valid 5 min (D2, ADR 001). Not ready → 409 `track_not_ready`. Response is `Cache-Control: no-store`.'
      x-rate-limit: 120 per minute per user (bucket `stream_url`)
      responses:
        '200':
          description: Signed URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /tracks/{trackId}/like:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    put:
      tags: [tracks]
      operationId: likeTrack
      summary: Like track
      description: Idempotent.
      x-rate-limit: shared bucket `social_write`
      responses:
        '200':
          description: Like state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [tracks]
      operationId: unlikeTrack
      summary: Unlike track
      description: Idempotent.
      responses:
        '200':
          description: Like state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tracks/{trackId}/listens:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    post:
      tags: [tracks]
      operationId: reportListen
      summary: Report listen
      description: |
        Sent once per play session (one session = one start of the track in the queue) when it ends: track end, skip, queue change, or page hide (`fetch(..., {keepalive: true})`; `sendBeacon` cannot carry the bearer header).
        The server decides whether it counts (rules in DATA_MODEL §11) and answers 200 either way.
      x-rate-limit: 120 per minute per user (bucket `listen`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListenRequest' }
      responses:
        '200':
          description: Outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListenResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── stream ─────────────────────────────
  /stream/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: '`base64url(payload).base64url(hmacSha256(payload))`, see ADR 001.'
        schema: { type: string, maxLength: 512 }
    get:
      tags: [stream]
      operationId: streamAudio
      summary: Serve audio through nginx X-Accel (no JWT)
      description: |
        PHP verifies signature and expiry, re-checks the media still exists and is ready, then answers with `X-Accel-Redirect: /_protected/private/{audioKey}` and `Content-Type: audio/mp4`;
        nginx streams from MinIO with Range support and slice caching. The body/206 below is what the client receives from nginx.
        On 403/410 the player fetches a new stream URL and resumes at the current position.
      security: []
      parameters:
        - name: Range
          in: header
          required: false
          schema: { type: string, example: 'bytes=0-' }
      responses:
        '200':
          description: Full content.
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Cache-Control: { schema: { type: string, example: 'private, max-age=300' } }
          content:
            audio/mp4:
              schema: { type: string, contentMediaType: audio/mp4 }
        '206':
          description: Partial content.
          headers:
            Content-Range: { schema: { type: string } }
          content:
            audio/mp4:
              schema: { type: string, contentMediaType: audio/mp4 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '416': { description: Range not satisfiable (nginx). }
    head:
      tags: [stream]
      operationId: streamAudioHead
      summary: Stream audio head
      security: []
      responses:
        '200': { description: Headers only. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

  # ───────────────────────────── playlists ─────────────────────────────
  /playlists:
    post:
      tags: [playlists]
      operationId: createPlaylist
      summary: Create playlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlaylistRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /playlists/{playlistId}:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [playlists]
      operationId: getPlaylist
      summary: Get playlist
      responses:
        '200':
          description: Playlist header (items via `/items`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [playlists]
      operationId: updatePlaylist
      summary: Update playlist
      description: Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlaylistRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [playlists]
      operationId: deletePlaylist
      summary: Delete playlist
