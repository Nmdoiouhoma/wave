        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /playlists/{playlistId}/items:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [playlists]
      operationId: listPlaylistItems
      summary: List playlist items
      description: 'Ordered by `position` asc. `limit` max 100. Items whose track is not visible to the caller have `track: null`.'
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Page of items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistItemPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [playlists]
      operationId: addPlaylistItem
      summary: Add playlist item
      description: Owner only. Appends. Track must be ready and visible to the caller (else 404 / 409 `track_not_ready`). Duplicate → 409 `track_already_in_playlist`. 500 items → 409 `playlist_full`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddPlaylistItemRequest' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /playlists/{playlistId}/items/{trackId}:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
      - $ref: '#/components/parameters/TrackId'
    delete:
      tags: [playlists]
      operationId: removePlaylistItem
      summary: Remove playlist item
      description: Owner only. Compacts positions. Track not in playlist → 404.
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /playlists/{playlistId}/order:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
    put:
      tags: [playlists]
      operationId: reorderPlaylist
      summary: Reorder playlist
      description: Owner only. Full ordered list of every trackId currently in the playlist (including unavailable ones). Set mismatch (missing, extra, duplicate) → 409 `playlist_order_mismatch`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderPlaylistRequest' }
      responses:
        '204': { description: Reordered. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /playlists/{playlistId}/like:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
    put:
      tags: [playlists]
      operationId: likePlaylist
      summary: Like playlist
      x-rate-limit: shared bucket `social_write`
      responses:
        '200':
          description: Like state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [playlists]
      operationId: unlikePlaylist
      summary: Unlike playlist
      responses:
        '200':
          description: Like state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── posts ─────────────────────────────
  /posts:
    post:
      tags: [posts]
      operationId: createPost
      x-requires-verified-email: true
      summary: Create post
      description: |
        Multipart. Returns 202 `status: processing`; clip (and visual) produced by the worker; poll `GET /posts/{id}`.
        Rules (D4, D5): track ready and visible, and (caller owns it, or track public with `allowClips`) else 422 `clips_not_allowed`;
        `clipStartMs + clipDurationMs ≤ track.durationMs` else 422 `clip_out_of_range`.
        Visual optional: image ≤ 5 MB (jpg/png/webp) or video MP4 ≤ 15 MB, ≤ 60 s (any audio stream is stripped). Oversize → 413, other type → 415.
        Hashtags are extracted from the caption (max 10).
      x-rate-limit: 30 per day per user (bucket `post_create`)
      x-body-limit: 32M (nginx)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PostUpload' }
            encoding:
              visual: { contentType: 'image/jpeg, image/png, image/webp, video/mp4' }
      responses:
        '202':
          description: Accepted, processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [posts]
      operationId: getPost
      summary: Get post
      description: Non-playable posts → 404 except for the author and moderators.
      responses:
        '200':
          description: Post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [posts]
      operationId: deletePost
      summary: Delete post
      description: Author or moderator.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /posts/{postId}/stream-url:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [posts, stream]
      operationId: getPostStreamUrl
      summary: Get post stream url
      description: Fresh signed clip URL when the one embedded in `Post.clip` expired. Not ready → 409 `track_not_ready`.
      x-rate-limit: shared bucket `stream_url`
      responses:
        '200':
          description: Signed URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /posts/{postId}/like:
    parameters:
      - $ref: '#/components/parameters/PostId'
    put:
      tags: [posts]
      operationId: likePost
      summary: Like post
      x-rate-limit: shared bucket `social_write`
      responses:
        '200':
          description: Like state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [posts]
      operationId: unlikePost
      summary: Unlike post
      responses:
        '200':
          description: Like state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /posts/{postId}/comments:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [posts]
      operationId: listComments
      summary: List comments
      description: Newest first. Hidden comments omitted (except for their author and moderators).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of comments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [posts]
      operationId: createComment
      x-requires-verified-email: true
      summary: Create comment
      x-rate-limit: 10 per minute and 200 per day per user (bucket `comment`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommentRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [posts]
      operationId: deleteComment
      summary: Delete comment
      description: Comment author, post author or moderator.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /post-views:
    post:
      tags: [posts]
      operationId: reportPostViews
      summary: Report post views
      description: Batched by the client (flush every 10 s, on feed exit and on page hide with `keepalive`). Unknown or invisible post ids are ignored silently. Upsert semantics (DATA_MODEL §11).
      x-rate-limit: 60 per minute per user (bucket `post_view`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostViewsRequest' }
      responses:
        '204': { description: Recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── feed ─────────────────────────────
  /feed/for-you:
    get:
      tags: [feed]
      operationId: getForYouFeed
      summary: Get for you feed
      description: |
        Ranked by `FeedRanker` (ADR 005). Excludes posts already viewed (PostView), own posts and non-playable posts; max 2 posts per author per page.
        When unseen candidates run out, falls back to already-seen posts by trending score (never empty if any playable post exists).
        Cursor is opaque and session-bound; duplicates across pages are possible after affinity recomputation, clients dedupe by id. `limit` default 10, max 20.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: Page of posts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /feed/following:
    get:
      tags: [feed]
      operationId: getFollowingFeed
      summary: Get following feed
      description: Playable posts by followed users, newest first (seen posts included). `limit` default 10, max 20.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: Page of posts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── search ─────────────────────────────
  /search:
    get:
      tags: [search]
      operationId: search
      summary: Search
      description: |
        `SearchProvider` v1 = PostgreSQL FTS (`simple` + unaccent, prefix match on every token) + pg_trgm similarity.
        Without `type`: every section present with ≤ 5 items (a section's `nextCursor` can be reused with `type=`).
        With `type`: only that section, paginated (`limit` default 20, max 50, at most 200 results reachable).
        Only content visible to the caller is returned.
      x-rate-limit: 60 per minute per user (bucket `search`)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/SearchType' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /hashtags/{name}:
    parameters:
      - $ref: '#/components/parameters/HashtagName'
    get:
      tags: [search]
      operationId: getHashtag
      summary: Get hashtag
      responses:
        '200':
          description: Hashtag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hashtag' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hashtags/{name}/posts:
    parameters:
      - $ref: '#/components/parameters/HashtagName'
    get:
      tags: [search]
      operationId: listHashtagPosts
      summary: List hashtag posts
      description: Playable posts with this hashtag, newest first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of posts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── reports ─────────────────────────────
  /reports:
    post:
      tags: [reports]
      operationId: createReport
      x-requires-verified-email: true
      summary: Create report
      description: |
        Target must be visible to the caller (else 404). Own content → 422 `cannot_report_own`. Same reporter + target twice → 409 `already_reported`.
        5 distinct open reporters auto-hide the target (not for `user` targets). The response never reveals whether auto-hide happened.
      x-rate-limit: 20 per hour per user (bucket `report`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReportRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── admin ─────────────────────────────
  /admin/report-targets:
    get:
      tags: [admin]
      operationId: listReportTargets
      summary: List report targets
      description: ROLE_MODERATOR. Moderation queue grouped by target, most reported first then oldest first. Non-moderator → 403 `forbidden`.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReportStatus' }
          description: Filter on report status (default `open`).
        - name: targetType
          in: query
          schema: { $ref: '#/components/schemas/ReportTargetType' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of targets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportTargetPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/report-targets/{targetType}/{targetId}/reports:
    parameters:
      - $ref: '#/components/parameters/ReportTargetTypePath'
      - $ref: '#/components/parameters/ReportTargetIdPath'
    get:
      tags: [admin]
      operationId: listReportsForTarget
      summary: List reports for target
      description: ROLE_MODERATOR. Individual reports for one target, newest first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of reports.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/report-targets/{targetType}/{targetId}/decision:
    parameters:
      - $ref: '#/components/parameters/ReportTargetTypePath'
      - $ref: '#/components/parameters/ReportTargetIdPath'
    post:
      tags: [admin]
      operationId: decideReportTarget
      summary: Decide report target
      description: |
        ROLE_MODERATOR. Applies to every open report of the target (DATA_MODEL §13).
        `hide` → target hidden, reports actioned. `dismiss` → target visible again, reports dismissed. `suspend` (user targets only, else 422) → account suspended, refresh tokens revoked, reports actioned.
        A decision is also allowed with no open report (proactive moderation).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationDecisionRequest' }
      responses:
        '200':
          description: Target after decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportTarget' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: wave_refresh
      description: 'Web only. `HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=2592000`. Documented for reference; auth routes declare `security: []`.'

  parameters:
    WaveClient:
      name: X-Wave-Client
      in: header
      required: false
      description: '`mobile` → refresh token in JSON body, no cookie. Absent or `web` → refresh token only in the `wave_refresh` cookie (D3).'
      schema: { type: string, enum: [web, mobile], default: web }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque value from a previous `nextCursor`.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Username:
      name: username
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9_.]{3,30}$' }
    ArtistSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 80 }
    TrackId:
      name: trackId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HashtagName:
      name: name
      in: path
      required: true
      description: Lowercase, without `#`.
      schema: { type: string, maxLength: 50 }
    ReportTargetTypePath:
      name: targetType
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ReportTargetType' }
    ReportTargetIdPath:
      name: targetId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    AuthSession:
      description: 'Session opened. Web also receives `Set-Cookie: wave_refresh=…`.'
      headers:
        Set-Cookie:
          description: Web only.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthSession' }
    BadRequest:
      description: 'Malformed body/query (`malformed_request`), bad cursor (`invalid_cursor`), bad emailed token (`account_token_invalid`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: '`unauthenticated`, `token_expired`, `invalid_credentials`, `refresh_token_invalid`, `token_reused`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: '`forbidden`, `account_suspended`, `stream_token_invalid`, `email_not_verified`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: '`not_found` (also used for resources the caller may not see).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 'State conflict, see `code`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: '`stream_token_expired`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: '`payload_too_large` (PHP check; nginx may answer a bare 413 above 32 MB).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: '`unsupported_media_type`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: '`validation_failed` (with `violations`) or a business rule code.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: '`rate_limited`.'
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ── errors ──
    ProblemCode:
      type: string
      enum:
        - malformed_request          # 400
        - invalid_cursor             # 400
        - account_token_invalid      # 400
        - unauthenticated            # 401
        - token_expired              # 401
        - invalid_credentials        # 401
        - refresh_token_invalid      # 401
        - token_reused               # 401
        - forbidden                  # 403
        - account_suspended          # 403
        - stream_token_invalid       # 403
        - email_not_verified         # 403
        - not_found                  # 404
        - email_taken                # 409
        - username_taken             # 409
        - artist_limit_reached       # 409
        - artist_has_tracks          # 409
        - track_not_ready            # 409
        - track_already_in_playlist  # 409
        - playlist_full              # 409
        - playlist_order_mismatch    # 409
        - already_reported           # 409
        - too_many_pending_uploads   # 409
        - upload_already_used        # 409
        - upload_expired             # 409
        - upload_incomplete          # 409
        - email_already_verified     # 409
        - stream_token_expired       # 410
        - payload_too_large          # 413
        - unsupported_media_type     # 415
        - validation_failed          # 422
        - artist_required            # 422
        - clips_not_allowed          # 422
        - clip_out_of_range          # 422
        - cannot_follow_self         # 422
        - cannot_report_own          # 422
        - rate_limited               # 429
        - internal_error             # 500
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, description: '`urn:wave:problem:{code}`', example: 'urn:wave:problem:validation_failed' }
        title: { type: string, description: 'Short English summary, stable per code.' }
        status: { type: integer }
        detail: { type: string, description: 'Human-readable, may vary. Never contains internals.' }
        code: { $ref: '#/components/schemas/ProblemCode' }
        violations:
          type: array
          description: Only for `validation_failed`.
          items: { $ref: '#/components/schemas/Violation' }
    Violation:
      type: object
      required: [propertyPath, message]
      properties:
        propertyPath: { type: string, example: username }
        message: { type: string }
        code: { type: [string, 'null'], description: Symfony constraint code (UUID) for client-side mapping. }

    # ── shared ──
    Id:
      type: string
      format: uuid
      description: UUID v7.
    DateTime:
      type: string
      format: date-time
      example: '2026-10-24T08:15:30Z'
    MediaUrl:
      type: [string, 'null']
      format: uri
      description: Absolute URL under `MEDIA_PUBLIC_BASE_URL` (`…/media/{key}`), immutable content (long cache), or null.
    MediaStatus:
      type: string
      enum: [processing, ready, failed]
    FailureReason:
      type: [string, 'null']
      enum: [invalid_media, unsupported_codec, too_long, too_large, processing_error, null]
    Visibility:
      type: string
      enum: [public, private]
    Moderation:
      type: string
      enum: [visible, hidden]
    LikeState:
      type: object
      required: [liked, likeCount]
      properties:
        liked: { type: boolean }
        likeCount: { type: integer }
    FollowState:
      type: object
      required: [following, followersCount]
      properties:
        following: { type: boolean }
        followersCount: { type: integer, description: Followers of the target user. }
    StreamUrl:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri, example: 'https://wave.local/api/v1/stream/eyJr...Q.mT3...x' }
        expiresAt: { $ref: '#/components/schemas/DateTime' }

    # ── auth ──
    RegisterRequest:
      type: object
      required: [email, password, username, displayName]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 180 }
        password: { type: string, minLength: 10, maxLength: 128 }
        username: { type: string, pattern: '^[a-z0-9_.]{3,30}$' }
        displayName: { type: string, minLength: 1, maxLength: 50 }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string }
        password: { type: string }
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken: { type: string, description: Mobile only; ignored on web. }
    AccountTokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1, maxLength: 128 }
    PasswordResetRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 180 }
    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 10, maxLength: 128 }
    DeleteAccountRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string }
    AuthSession:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, const: 900 }
        refreshToken: { type: string, description: 'Mobile only (`X-Wave-Client: mobile`). Absent on web.' }
        refreshExpiresIn: { type: integer, description: 'Mobile only, seconds (2592000).' }
        user: { $ref: '#/components/schemas/Me' }

    # ── users ──
    UserSummary:
      type: object
      required: [id, username, displayName, avatarUrl]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { $ref: '#/components/schemas/MediaUrl' }
    UserProfile:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [bio, followersCount, followingCount, createdAt, isMe, isFollowedByMe]
          properties:
            bio: { type: [string, 'null'] }
            followersCount: { type: integer }
            followingCount: { type: integer }
            createdAt: { $ref: '#/components/schemas/DateTime' }
            isMe: { type: boolean }
            isFollowedByMe: { type: boolean }
    Me:
      allOf:
        - $ref: '#/components/schemas/UserProfile'
        - type: object
          required: [email, emailVerified, roles]
          properties:
            email: { type: string, format: email }
            emailVerified: { type: boolean }
            roles:
              type: array
              items: { type: string, enum: [ROLE_USER, ROLE_MODERATOR, ROLE_ADMIN] }
    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 50 }
        bio: { type: [string, 'null'], maxLength: 300 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 10, maxLength: 128 }
    ImageUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: JPEG, PNG or WebP, ≤ 5 MB (5242880 bytes).

    # ── artists / genres ──
    ArtistSummary:
      type: object
      required: [id, slug, name, avatarUrl]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { type: string }
        name: { type: string }
        avatarUrl: { $ref: '#/components/schemas/MediaUrl' }
    Artist:
      allOf:
        - $ref: '#/components/schemas/ArtistSummary'
        - type: object
          required: [bio, trackCount, owner, moderation, isOwner, createdAt]
          properties:
            bio: { type: [string, 'null'] }
            trackCount: { type: integer, description: 'Public, ready, visible tracks.' }
            owner: { $ref: '#/components/schemas/UserSummary' }
            moderation: { $ref: '#/components/schemas/Moderation' }
            isOwner: { type: boolean }
            createdAt: { $ref: '#/components/schemas/DateTime' }
    CreateArtistRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        bio: { type: [string, 'null'], maxLength: 1000 }
    UpdateArtistRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        bio: { type: [string, 'null'], maxLength: 1000 }
    Genre:
      type: object
      required: [id, name]
      properties:
        id: { type: string, example: rap-fr, description: Stable slug. }
        name: { type: string, example: 'Rap français', description: French display name. }

    # ── tracks ──
    Track:
      type: object
      required: [id, title, artist, owner, genre, coverUrl, durationMs, status, failureReason, visibility, allowClips, moderation, playCount, likeCount, likedByMe, isOwner, canClip, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        artist: { $ref: '#/components/schemas/ArtistSummary' }
        owner: { $ref: '#/components/schemas/UserSummary' }
        genre: { $ref: '#/components/schemas/Genre' }
        coverUrl: { $ref: '#/components/schemas/MediaUrl' }
        durationMs: { type: [integer, 'null'], description: Null while processing. }
        status: { $ref: '#/components/schemas/MediaStatus' }
        failureReason: { $ref: '#/components/schemas/FailureReason' }
        visibility: { $ref: '#/components/schemas/Visibility' }
        allowClips: { type: boolean }
        moderation: { $ref: '#/components/schemas/Moderation' }
        playCount: { type: integer }
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        isOwner: { type: boolean }
        canClip: { type: boolean, description: Caller may create a post from this track now (D5). }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    CreateTrackUploadRequest:
      type: object
      required: [filename, size, contentType]
      additionalProperties: false
      properties:
        filename: { type: string, minLength: 1, maxLength: 255, description: 'Original name; only its extension is used (`mp3`, `m4a`, `aac`, `mp4`).' }
        size: { type: integer, minimum: 1, maximum: 209715200, description: Declared bytes. }
        contentType: { type: string, enum: [audio/mpeg, audio/mp4, audio/aac, audio/x-m4a, video/mp4] }
    TrackUploadSlot:
      type: object
      required: [uploadId, method, url, fields, maxBytes, expiresAt]
      properties:
        uploadId: { $ref: '#/components/schemas/Id' }
        method: { type: string, const: POST }
        url: { type: string, format: uri, description: 'Dev: `http://localhost:8090/upload/wave-private`; prod: the S3 bucket endpoint.' }
        fields:
          type: object
          description: Form fields to send verbatim before `file` (key, policy, x-amz-algorithm, x-amz-credential, x-amz-date, x-amz-signature…).
          additionalProperties: { type: string }
        maxBytes: { type: integer }
        expiresAt: { $ref: '#/components/schemas/DateTime' }
    CreateTrackRequest:
      type: object
      required: [uploadId, title, genreId]
      additionalProperties: false
      properties:
        uploadId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        genreId: { type: string }
        artistId: { type: string, format: uuid }
        visibility: { $ref: '#/components/schemas/Visibility' }
        allowClips: { type: boolean, default: true }
    UpdateTrackRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        genreId: { type: string }
        artistId: { type: string, format: uuid }
        visibility: { $ref: '#/components/schemas/Visibility' }
        allowClips: { type: boolean }
    ListenRequest:
      type: object
      required: [listenedMs, source]
      additionalProperties: false
      properties:
        listenedMs: { type: integer, minimum: 0, maximum: 3600000, description: 'Actual audio time played (not wall clock, seeks excluded).' }
        source: { type: string, enum: [player, feed] }
        postId: { type: string, format: uuid, description: Required when source=feed. }
    ListenResult:
      type: object
      required: [counted, playCount]
      properties:
        counted: { type: boolean }
        playCount: { type: integer }

    # ── playlists ──
    Playlist:
      type: object
      required: [id, name, description, isPublic, owner, coverUrl, itemCount, likeCount, likedByMe, moderation, isOwner, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        description: { type: [string, 'null'] }
        isPublic: { type: boolean }
        owner: { $ref: '#/components/schemas/UserSummary' }
        coverUrl: { $ref: '#/components/schemas/MediaUrl' }
        itemCount: { type: integer }
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        moderation: { $ref: '#/components/schemas/Moderation' }
        isOwner: { type: boolean }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    CreatePlaylistRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 300 }
        isPublic: { type: boolean, default: true }
    UpdatePlaylistRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 300 }
        isPublic: { type: boolean }
    PlaylistItem:
      type: object
      required: [trackId, position, addedAt, track]
      properties:
        trackId: { $ref: '#/components/schemas/Id' }
        position: { type: integer, minimum: 0 }
        addedAt: { $ref: '#/components/schemas/DateTime' }
        track:
          oneOf:
            - $ref: '#/components/schemas/Track'
            - type: 'null'
          description: Null when the track is not visible to the caller.
    AddPlaylistItemRequest:
      type: object
      required: [trackId]
      additionalProperties: false
      properties:
        trackId: { type: string, format: uuid }
    ReorderPlaylistRequest:
      type: object
      required: [trackIds]
      additionalProperties: false
      properties:
        trackIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }

    # ── posts ──
    PostVisual:
      type: object
      required: [type, url, posterUrl]
      properties:
        type: { type: string, enum: [image, video] }
        url: { type: string, format: uri }
        posterUrl: { type: [string, 'null'], format: uri, description: Video only. }
    Post:
      type: object
      required: [id, author, track, clipStartMs, clipDurationMs, clip, visual, caption, hashtags, status, failureReason, moderation, likeCount, commentCount, viewCount, likedByMe, isOwner, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        author: { $ref: '#/components/schemas/UserSummary' }
        track: { $ref: '#/components/schemas/Track' }
        clipStartMs: { type: integer, minimum: 0 }
        clipDurationMs: { type: integer, minimum: 15000, maximum: 60000 }
        clip:
          oneOf:
            - $ref: '#/components/schemas/StreamUrl'
            - type: 'null'
          description: Signed clip URL (TTL 5 min) embedded to avoid one call per post; null unless ready. Expired → `GET /posts/{id}/stream-url`.
        visual:
          oneOf:
            - $ref: '#/components/schemas/PostVisual'
            - type: 'null'
          description: Null when no visual or not processed yet; client falls back to `track.coverUrl`.
        caption: { type: [string, 'null'] }
        hashtags:
          type: array
          items: { type: string }
        status: { $ref: '#/components/schemas/MediaStatus' }
        failureReason: { $ref: '#/components/schemas/FailureReason' }
        moderation: { $ref: '#/components/schemas/Moderation' }
        likeCount: { type: integer }
        commentCount: { type: integer }
        viewCount: { type: integer }
        likedByMe: { type: boolean }
        isOwner: { type: boolean }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    PostUpload:
      type: object
      required: [trackId, clipStartMs, clipDurationMs]
      properties:
        trackId: { type: string, format: uuid }
        clipStartMs: { type: integer, minimum: 0 }
        clipDurationMs: { type: integer, minimum: 15000, maximum: 60000 }
        caption: { type: string, maxLength: 300 }
        visual:
          type: string
          contentMediaType: application/octet-stream
          description: Optional. Image ≤ 5 MB (jpg/png/webp) or MP4 ≤ 15 MB (15728640 bytes), ≤ 60 s.
    Comment:
      type: object
      required: [id, postId, author, body, moderation, createdAt, canDelete]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        postId: { $ref: '#/components/schemas/Id' }
        author: { $ref: '#/components/schemas/UserSummary' }
        body: { type: string }
        moderation: { $ref: '#/components/schemas/Moderation' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        canDelete: { type: boolean }
    CreateCommentRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 500 }
    PostViewsRequest:
      type: object
      required: [views]
      additionalProperties: false
      properties:
        views:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [postId, watchedMs]
            additionalProperties: false
            properties:
              postId: { type: string, format: uuid }
              watchedMs: { type: integer, minimum: 0, maximum: 600000 }

    # ── search ──
    SearchType:
      type: string
      enum: [tracks, artists, users, playlists, hashtags]
    Hashtag:
      type: object
      required: [name, postCount]
      properties:
        name: { type: string, example: lofi }
        postCount: { type: integer }
    SearchResults:
      type: object
      description: Sections present according to `type` (see operation).
      properties:
        tracks: { $ref: '#/components/schemas/TrackPage' }
        artists: { $ref: '#/components/schemas/ArtistPage' }
        users: { $ref: '#/components/schemas/UserPage' }
        playlists: { $ref: '#/components/schemas/PlaylistPage' }
        hashtags: { $ref: '#/components/schemas/HashtagPage' }

    # ── reports ──
    ReportTargetType:
      type: string
      enum: [track, post, comment, playlist, artist, user]
    ReportReason:
      type: string
      enum: [spam, harassment, hate, sexual, violence, copyright, impersonation, other]
    ReportStatus:
      type: string
      enum: [open, actioned, dismissed]
    CreateReportRequest:
      type: object
      required: [targetType, targetId, reason]
      additionalProperties: false
      properties:
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetId: { type: string, format: uuid }
        reason: { $ref: '#/components/schemas/ReportReason' }
        details: { type: [string, 'null'], maxLength: 1000 }
    ReportReceipt:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/ReportStatus' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    Report:
      type: object
      required: [id, reporter, targetType, targetId, reason, details, status, handledBy, handledAt, decisionNote, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        reporter: { $ref: '#/components/schemas/UserSummary' }
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetId: { $ref: '#/components/schemas/Id' }
        reason: { $ref: '#/components/schemas/ReportReason' }
        details: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ReportStatus' }
        handledBy:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        handledAt: { type: [string, 'null'], format: date-time }
        decisionNote: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    ReportTarget:
      type: object
      required: [targetType, targetId, preview, moderation, openReportCount, reasons, firstReportedAt, lastReportedAt]
      properties:
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetId: { $ref: '#/components/schemas/Id' }
        preview:
          type: [object, 'null']
          description: Null when the target was deleted.
          required: [label]
          properties:
            label: { type: string, description: 'Track title, post caption, comment body (truncated 140), playlist/artist name, or username.' }
            imageUrl: { $ref: '#/components/schemas/MediaUrl' }
            owner: { $ref: '#/components/schemas/UserSummary' }
        moderation:
          type: [string, 'null']
          enum: [visible, hidden, null]
          description: Null for user targets.
        suspended: { type: [boolean, 'null'], description: User targets only. }
        openReportCount: { type: integer }
        reasons:
          type: object
          description: Count of open reports per reason.
          additionalProperties: { type: integer }
        firstReportedAt: { $ref: '#/components/schemas/DateTime' }
        lastReportedAt: { $ref: '#/components/schemas/DateTime' }
    ModerationDecisionRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action: { type: string, enum: [hide, dismiss, suspend] }
        note: { type: [string, 'null'], maxLength: 500 }

    # ── pages ──
    UserPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
        nextCursor: { type: [string, 'null'] }
    ArtistPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Artist' } }
        nextCursor: { type: [string, 'null'] }
    TrackPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Track' } }
        nextCursor: { type: [string, 'null'] }
    PlaylistPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Playlist' } }
        nextCursor: { type: [string, 'null'] }
    PlaylistItemPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PlaylistItem' } }
        nextCursor: { type: [string, 'null'] }
    PostPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Post' } }
        nextCursor: { type: [string, 'null'] }
    CommentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        nextCursor: { type: [string, 'null'] }
    HashtagPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Hashtag' } }
        nextCursor: { type: [string, 'null'] }
    ReportPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Report' } }
        nextCursor: { type: [string, 'null'] }
    ReportTargetPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReportTarget' } }
        nextCursor: { type: [string, 'null'] }
