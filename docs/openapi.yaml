  # ───────────────────────────── genres ─────────────────────────────
  /genres:
    get:
      tags: [genres]
      operationId: listGenres
      summary: List genres
      description: 'Fixed list of 45 genres (French names), ordered by `position`, not paginated. Cacheable (`Cache-Control: public, max-age=86400`).'
      security: []
      responses:
        '200':
          description: Genres.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Genre' }

  # ───────────────────────────── tracks ─────────────────────────────
  /tracks/uploads:
    post:
      tags: [tracks]
      operationId: createTrackUpload
      x-requires-verified-email: true
      summary: Open a direct-to-storage upload for an audio file
      description: |
        Step 1 of the only track upload flow (ADR 009). Declares the file; returns a **presigned S3 POST** (form policy) valid 15 min, bound to the caller, writing to `quarantine/uploads/{userId}/{uploadId}`.
        The policy enforces `content-length-range` [1, `maxBytes`] and the exact key; the browser sends `multipart/form-data` with every `fields` entry first and the file last (field `file`) to `url`. Storage answers 204.
        Limits by declared extension: `.mp4` → 200 MB (209715200 bytes); `.mp3`, `.m4a`, `.aac` → 30 MB (31457280 bytes). `declaredSize` above the limit → 413; other extension/MIME → 415.
        Declared values are a pre-filter only: the worker re-checks container, codec, size and duration with ffprobe.
        At most 10 pending uploads per user (409 `too_many_pending_uploads`).
      x-rate-limit: 30 per hour and 100 per day per user (bucket `track_upload`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTrackUploadRequest' }
      responses:
        '201':
          description: Upload slot created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackUploadSlot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /tracks:
    post:
      tags: [tracks]
      operationId: createTrack
      x-requires-verified-email: true
      summary: Create a track from a completed upload
      description: |
        Step 2 (ADR 009). JSON body with the `uploadId` of step 1 and the metadata. Returns 202 with `status: processing`.
        Upload checks: not the caller's or unknown → 404; already used → 409 `upload_already_used`; older than 2 h → 409 `upload_expired`; object absent in storage → 409 `upload_incomplete`. The upload is consumed atomically (single use).
        The worker validates with ffprobe (audio stream present, MP3/AAC codec, ≤ 10 min, non-MP4 containers ≤ 30 MB, MP4 ≤ 200 MB; any video stream is discarded) then sets `ready` or `failed` + `failureReason`; clients poll `GET /tracks/{id}` (every 3 s, stop after 10 min).
        Artist resolution: `artistId` given → must be owned (else 404); omitted and user owns 0 artists → one is auto-created from `displayName`; omitted and exactly 1 → that one; omitted and several → 422 `artist_required`.
        Several files = several upload/create pairs in parallel (no batch endpoint). Cover is uploaded separately (`POST /tracks/{id}/cover`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTrackRequest' }
      responses:
        '202':
          description: Accepted, processing.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /tracks/{trackId}:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [tracks]
      operationId: getTrack
      summary: Get track
      responses:
        '200':
          description: Track.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tracks]
      operationId: updateTrack
      summary: Update track
      description: Owner only. `artistId` must be another artist owned by the caller, else 404 `not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTrackRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [tracks]
      operationId: deleteTrack
      summary: Delete track
      description: Owner only. Cascades to playlist items, likes, listens and every post using the track (including other users' posts); media purged asynchronously.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tracks/{trackId}/cover:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    post:
      tags: [tracks]
      operationId: uploadTrackCover
      x-requires-verified-email: true
      summary: Upload track cover
      description: Owner only. Async (202), same semantics as `POST /me/avatar`.
      x-rate-limit: shared bucket `image_upload`
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImageUpload' }
            encoding:
              file: { contentType: 'image/jpeg, image/png, image/webp' }
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [tracks]
      operationId: deleteTrackCover
      summary: Delete track cover
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tracks/{trackId}/stream-url:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [tracks, stream]
      operationId: getTrackStreamUrl
      summary: Get track stream url
      description: 'Access check (track visible to caller) then a signed URL valid 5 min (D2, ADR 001). Not ready → 409 `track_not_ready`. Response is `Cache-Control: no-store`. Success also records a listen grant for (caller, track) (DATA_MODEL §11, ADR 010): a listen only counts after a stream URL was issued.'
      x-rate-limit: 120 per minute per user (bucket `stream_url`)
      responses:
        '200':
          description: Signed URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /tracks/{trackId}/like:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    put:
      tags: [tracks]
      operationId: likeTrack
      summary: Like track
      description: Idempotent.
      x-rate-limit: shared bucket `social_write`
      responses:
        '200':
          description: Like state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [tracks]
      operationId: unlikeTrack
      summary: Unlike track
      description: Idempotent. An existing like by the caller is removed whatever the target's visibility (counter decremented); without a like, a target the caller cannot see → 404 `not_found`, as if it did not exist.
      responses:
        '200':
          description: Like state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tracks/{trackId}/listens:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    post:
      tags: [tracks]
      operationId: reportListen
      summary: Report listen
      description: |
        Sent once per play session (one session = one start of the track in the queue) when it ends: track end, skip, queue change, or page hide (`fetch(..., {keepalive: true})`; `sendBeacon` cannot carry the bearer header).
        The server decides whether it counts (rules in DATA_MODEL §11, ADR 010) and answers 200 either way, `counted: false` included when no fresh listen grant exists (no prior `stream-url`), the declared `listenedMs` exceeds the time elapsed since the grant, the anti-replay window or the daily cap applies. No 4xx for these: they are not distinguishable from a normal non-counted listen.
        Track not visible → 404; visible but not ready → 409 `track_not_ready`. Phase 2 implements `source=player`; `source=feed` (phase 3, W-32) uses the clip duration as reference and the grant written when the post's clip URL was issued (DATA_MODEL §11).
      x-rate-limit: 120 per minute per user (bucket `listen`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListenRequest' }
      responses:
        '200':
          description: Outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListenResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── stream ─────────────────────────────
  /stream/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: '`base64url(payload).base64url(hmacSha256(payload))`, see ADR 001.'
        schema: { type: string, maxLength: 512 }
    get:
      tags: [stream]
      operationId: streamAudio
      summary: Serve audio through nginx X-Accel (no JWT)
      description: |
        PHP verifies signature and expiry, re-checks the media still exists and is ready and, for a clip token (`k` = `c`), that the post is still visible to `uid` (DATA_MODEL §9), then answers with `X-Accel-Redirect: /_protected/private/{audioKey}` and `Content-Type: audio/mp4`;
        nginx streams from MinIO with Range support and slice caching. The body/206 below is what the client receives from nginx.
        On 403/410 the player fetches a new stream URL and resumes at the current position.
      security: []
      parameters:
        - name: Range
          in: header
          required: false
          schema: { type: string, example: 'bytes=0-' }
      responses:
        '200':
          description: Full content.
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Cache-Control: { schema: { type: string, example: 'private, max-age=300' } }
          content:
            audio/mp4:
              schema: { type: string, contentMediaType: audio/mp4 }
        '206':
          description: Partial content.
          headers:
            Content-Range: { schema: { type: string } }
          content:
            audio/mp4:
              schema: { type: string, contentMediaType: audio/mp4 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '416': { description: Range not satisfiable (nginx). }
    head:
      tags: [stream]
      operationId: streamAudioHead
      summary: Stream audio head
      security: []
      responses:
        '200': { description: Headers only. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

  # ───────────────────────────── playlists ─────────────────────────────
  /playlists:
    post:
      tags: [playlists]
      operationId: createPlaylist
      summary: Create playlist
      description: More than 200 playlists per user → 409 `playlist_limit_reached`.
      x-rate-limit: 600 per hour per user (shared bucket `playlist_write`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlaylistRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /playlists/{playlistId}:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [playlists]
      operationId: getPlaylist
      summary: Get playlist
      responses:
        '200':
          description: Playlist header (items via `/items`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [playlists]
      operationId: updatePlaylist
      summary: Update playlist
      description: Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlaylistRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [playlists]
      operationId: deletePlaylist
      summary: Delete playlist
      description: Owner only.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /playlists/{playlistId}/items:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [playlists]
      operationId: listPlaylistItems
      summary: List playlist items
      description: 'Ordered by `position` asc. `limit` max 100. Owner: items whose track is no longer visible to them are returned with `track: null` (trackId kept, needed for remove/reorder). Non-owner: such items are omitted entirely (no trackId leak), so positions may have gaps and fewer than `itemCount` items are listed.'
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Page of items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistItemPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [playlists]
      operationId: addPlaylistItem
      summary: Add playlist item
      description: Owner only. Appends. Track must be ready and visible to the caller (else 404 / 409 `track_not_ready`). Duplicate → 409 `track_already_in_playlist`. 500 items → 409 `playlist_full`.
      x-rate-limit: shared bucket `playlist_write`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddPlaylistItemRequest' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /playlists/{playlistId}/items/{trackId}:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
      - $ref: '#/components/parameters/TrackId'
    delete:
      tags: [playlists]
      operationId: removePlaylistItem
      summary: Remove playlist item
      description: Owner only. Compacts positions. Track not in playlist → 404.
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /playlists/{playlistId}/order:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
    put:
      tags: [playlists]
      operationId: reorderPlaylist
      summary: Reorder playlist
      description: Owner only. Full ordered list of every trackId currently in the playlist (including unavailable ones). Set mismatch (missing, extra, duplicate) → 409 `playlist_order_mismatch`. `trackIds` not a JSON array (e.g. an object), or an element not a uuid string → 422 `validation_failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderPlaylistRequest' }
      responses:
        '204': { description: Reordered. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /playlists/{playlistId}/like:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
    put:
      tags: [playlists]
      operationId: likePlaylist
      summary: Like playlist
      x-rate-limit: shared bucket `social_write`
      responses:
        '200':
          description: Like state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [playlists]
      operationId: unlikePlaylist
      summary: Unlike playlist
      description: Idempotent. An existing like by the caller is removed whatever the target's visibility (counter decremented); without a like, a target the caller cannot see → 404 `not_found`, as if it did not exist.
      responses:
        '200':
          description: Like state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── posts ─────────────────────────────
  /posts:
    post:
      tags: [posts]
      operationId: createPost
      x-requires-verified-email: true
      summary: Create post
      description: |
        Multipart. Returns 202 `status: processing`; clip (and visual) produced by the worker; poll `GET /posts/{id}`.
        Rules (D4, D5, DATA_MODEL §9), in this order: `trackId` unknown or not visible to the caller → 404 `not_found` (same body as an unknown id);
        others' track visible to the caller but not public with `allowClips: true` (clips off, or a `followers`/`close_friends` track), or own track hidden by moderation → 422 `clips_not_allowed`; own track processing/failed → 409 `track_not_ready`;
        `clipStartMs + clipDurationMs ≤ track.durationMs` else 422 `clip_out_of_range`. The visual is checked (413/415) before the post row is created.
        Visual optional: image ≤ 5 MB (jpg/png/webp) or video MP4 ≤ 15 MB, ≤ 60 s (any audio stream is stripped). Oversize → 413, other type → 415.
        Hashtags are extracted from the caption (max 10, `#Lo_Fi #lofi` → `lo_fi`, `lofi`).
        A post on the caller's own non-public track is playable only by that track's audience, now and after any later audience change (FB-18); the client warns before submitting.
      x-rate-limit: 30 per day per user (bucket `post_create`)
      x-body-limit: 32M (nginx)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PostUpload' }
            encoding:
              visual: { contentType: 'image/jpeg, image/png, image/webp, video/mp4' }
      responses:
        '202':
          description: Accepted, processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [posts]
      operationId: getPost
      summary: Get post
      description: Posts not playable for the caller (DATA_MODEL §9, viewer-dependent since FB-18) → 404 except for the author and moderators. A post whose track the caller cannot see → 404, author included (DATA_MODEL §9).
      responses:
        '200':
          description: Post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [posts]
      operationId: deletePost
      summary: Delete post
      description: Author or moderator. The author may delete their post whatever its visibility; for anyone else a post they cannot see → 404, a visible post of someone else → 403. Hashtag counts, reports and stored objects are cleaned up (DATA_MODEL §9).
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /posts/{postId}/stream-url:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [posts, stream]
      operationId: getPostStreamUrl
      summary: Get post stream url
      description: Fresh signed clip URL when the one embedded in `Post.clip` expired. Not ready → 409 `track_not_ready`.
      x-rate-limit: shared bucket `stream_url`
      responses:
        '200':
          description: Signed URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /posts/{postId}/like:
    parameters:
      - $ref: '#/components/parameters/PostId'
    put:
      tags: [posts]
      operationId: likePost
      summary: Like post
      x-rate-limit: shared bucket `social_write`
      responses:
        '200':
          description: Like state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [posts]
      operationId: unlikePost
      summary: Unlike post
      description: Idempotent. An existing like by the caller is removed whatever the target's visibility (counter decremented); without a like, a target the caller cannot see → 404 `not_found`, as if it did not exist.
      responses:
        '200':
          description: Like state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /posts/{postId}/comments:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [posts]
      operationId: listComments
      summary: List comments
      description: Newest first. Hidden comments omitted (except for their author and moderators); comments by suspended authors omitted. Post not visible to the caller → 404.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of comments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [posts]
      operationId: createComment
      x-requires-verified-email: true
      summary: Create comment
      description: Post must be playable for the caller (else 404). Body trimmed, 1–500 characters after trim (else 422 `validation_failed`); plain text, clients never render it as HTML.
      x-rate-limit: 10 per minute and 200 per day per user (bucket `comment`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommentRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [posts]
      operationId: deleteComment
      summary: Delete comment
      description: Comment author, post author or moderator. A comment the caller cannot see (DATA_MODEL §10) → 404, identical to an unknown id; visible but not deletable → 403.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /post-views:
    post:
      tags: [posts]
      operationId: reportPostViews
      summary: Report post views
      description: Batched by the client (flush every 10 s, on feed exit and on page hide with `keepalive`). Unknown, invisible and own post ids are ignored silently (204 either way, no existence oracle). Upsert semantics (DATA_MODEL §11), `watchedMs` clamped to the clip duration, max kept, duplicates in a batch merged. Any recorded view marks the post as seen for `/feed/for-you`.
      x-rate-limit: 60 per minute per user (bucket `post_view`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostViewsRequest' }
      responses:
        '204': { description: Recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── feed ─────────────────────────────
  /feed/for-you:
    get:
      tags: [feed]
      operationId: getForYouFeed
      x-rate-limit: 60 per minute per user
      summary: Get for you feed
      description: |
        Ranked by `FeedRanker`: phase 3 = `SimpleFeedRanker` (ADR 011: followed authors, liked genres, recent popular posts), phase 4 = ADR 005 ranker (W-40), same contract.
        Excludes posts already viewed (PostView), own posts and non-playable posts (suspended authors included); max 2 posts per author per page.
        A session starts with a request without cursor. When unseen candidates run out, the session continues with already-seen posts, least recently seen first, never repeating a post within the session.
        The first page is never empty if another user has a playable post. A page may contain fewer than `limit` items while `nextCursor` is not null; `nextCursor: null` ends the session (the client may start a new one).
        Cursor is opaque and session-bound; a cursor issued by another ranker version → 400 `invalid_cursor` (client restarts without cursor). Duplicates across pages are possible when likes/follows change scores mid-session; clients dedupe by id. `limit` default 10, max 20.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: Page of posts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /feed/following:
    get:
      tags: [feed]
      operationId: getFollowingFeed
      summary: Get following feed
      description: Playable posts by followed users (suspended authors excluded), newest first (seen posts included), keyset on `(createdAt, id)`. Empty page and null `nextCursor` when the caller follows nobody. `limit` default 10, max 20.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: Page of posts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── search ─────────────────────────────
  /search:
    get:
      tags: [search]
      operationId: search
      summary: Search
      description: |
        `SearchProvider` v1 = PostgreSQL FTS (`simple` + unaccent, prefix match on every token) + pg_trgm similarity.
        **Phase 2 (W-27, FB-07; W-29a, FB-15)**: only `type=users` and `type=tracks` are implemented; `type` is then required and any other value (or none) → 422 `validation_failed`. Phase 4 adds the other types and the no-`type` overview without changing this shape.
        **Users**: matches `username` and `displayName`, case- and accent-insensitive (`wave_unaccent(lower(...))`), a user matches if either field starts with `q` (prefix, also per word of displayName) or trigram similarity ≥ 0.3. Ranking: exact username match first, then prefix match, then `greatest(similarity(username), similarity(displayName))` desc, then `followersCount` desc, then id. Suspended users and the caller are excluded. Items carry `isFollowedByMe` for inline follow buttons.
        **Tracks** (FB-15, W-29a): only tracks the caller can see **and** play: `status=ready` ∧ `moderation=visible` ∧ caller in the track's audience (owner, public, follower of a `followers` track, member of the owner's close friends for a `close_friends` track; DATA_MODEL §6) ∧ owner not suspended. Others' tracks outside the caller's audience, processing, failed or hidden tracks, the caller's own processing/failed/hidden tracks and every track of a suspended owner are never returned (stricter than `GET /tracks/{id}` for suspended owners, F18). A track matches if its title or its artist name starts with `q` (also per word) or has trigram similarity ≥ 0.3, with the same normalisation as users. Ranking: tracks owned by the caller first, then tracks liked by the caller, then exact title match, prefix match, `greatest(similarity(title), similarity(artist name))` desc, `playCount` desc, id. No extra parameter: the caller's own and liked tracks surface first by this ranking (they are already known to the caller, so no oracle). Items are full `Track` objects (`likedByMe`, `isOwner`, `canClip` without N+1).
        Without `type` (phase 4): every section present with ≤ 5 items (a section's `nextCursor` can be reused with `type=`).
        With `type`: only that section, paginated (`limit` default 20, max 50, at most 200 results reachable); the cursor is bound to `q` and `type` (reused with another one → 400 `invalid_cursor`).
        Only content visible to the caller is returned.
      x-rate-limit: 60 per minute and 1000 per day per user (bucket `search`; anti-scraping)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/SearchType' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /hashtags/{name}:
    parameters:
      - $ref: '#/components/parameters/HashtagName'
    get:
      tags: [search]
      operationId: getHashtag
      summary: Get hashtag
      responses:
        '200':
          description: Hashtag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hashtag' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hashtags/{name}/posts:
    parameters:
      - $ref: '#/components/parameters/HashtagName'
    get:
      tags: [search]
      operationId: listHashtagPosts
      summary: List hashtag posts
      description: Playable posts with this hashtag, newest first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of posts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── reports ─────────────────────────────
  /reports:
    post:
      tags: [reports]
      operationId: createReport
      x-requires-verified-email: true
      summary: Create report
      description: |
        Checks in order (DATA_MODEL §13): body → 422; target not visible to the caller (hidden, private, non-playable post, comment of an invisible post, suspended user…) → 404 byte-identical to an unknown id;
        own content (user target = self) → 422 `cannot_report_own`; same reporter + target twice → 409 `already_reported`. `targetId` of a `user` target is the user's `id`.
        5 distinct open reporters auto-hide the target (not for `user` targets). The response never reveals whether auto-hide happened.
      x-rate-limit: 20 per hour per user (bucket `report`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReportRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── admin ─────────────────────────────
  /admin/report-targets:
    get:
      tags: [admin]
      operationId: listReportTargets
      summary: List report targets
      description: ROLE_MODERATOR. Moderation queue grouped by target, most reported first then oldest first (keyset on `(openReportCount DESC, firstReportedAt ASC, targetType, targetId)`, counts may move between pages). With `status` other than `open`, `openReportCount` counts the reports of that status. Non-moderator → 403 `forbidden` on every `/admin` route; routes marked ROLE_ADMIN also answer 403 to a moderator before any lookup (ADR 013).
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReportStatus' }
          description: Filter on report status (default `open`).
        - name: targetType
          in: query
          schema: { $ref: '#/components/schemas/ReportTargetType' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of targets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportTargetPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/report-targets/{targetType}/{targetId}/reports:
    parameters:
      - $ref: '#/components/parameters/ReportTargetTypePath'
      - $ref: '#/components/parameters/ReportTargetIdPath'
    get:
      tags: [admin]
      operationId: listReportsForTarget
      summary: List reports for target
      description: ROLE_MODERATOR. Individual reports for one target, newest first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of reports.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/report-targets/{targetType}/{targetId}/decision:
    parameters:
      - $ref: '#/components/parameters/ReportTargetTypePath'
      - $ref: '#/components/parameters/ReportTargetIdPath'
    post:
      tags: [admin]
      operationId: decideReportTarget
      summary: Decide report target
      description: |
        ROLE_MODERATOR. Applies to every open report of the target (DATA_MODEL §13).
        `hide` → target hidden, reports actioned. `dismiss` → target visible again, reports dismissed. `suspend` (user targets only, else 422) → account suspended, refresh tokens revoked, reports actioned.
        `hide` on a user target, suspending oneself or an already suspended user → 422 `validation_failed`. Unknown target → 404. Non-moderator → 403 before any lookup.
        A decision is also allowed with no open report (proactive moderation, used by the back-office content list to hide / restore). `suspend` follows the role guard of ADR 013 §2 (a moderator on a moderator or admin, anyone on an admin → 403 `forbidden`, checked after the 404). Unsuspend: `DELETE /admin/users/{userId}/suspension`. Every decision is journaled `admin.report_decided` (FB-28).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationDecisionRequest' }
      responses:
        '200':
          description: Target after decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportTarget' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ───────────────────────── admin back-office (FB-28, ADR 013) ─────────────────────────
  /admin/dashboard:
    get:
      tags: [admin]
      operationId: getAdminDashboard
      summary: Get admin dashboard
      description: ROLE_MODERATOR. Live counters (cached 60 s server-side). For a moderator, `alerts` and `announcements` are null.
      responses:
        '200':
          description: Counters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users:
    get:
      tags: [admin]
      operationId: listAdminUsers
      summary: List users (admin)
      description: |
        ROLE_MODERATOR. Newest accounts first (keyset on `id` DESC). Suspended and unverified users included.
        `q` matches username and display name (prefix + trigram, as `/search?type=users`); for an admin, a `q` containing `@` matches the email exactly (case-insensitive) instead. `email` is null for moderators.
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 1, maxLength: 180 }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/AdminRole' }
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended, unverified] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/AdminUserIdPath'
    get:
      tags: [admin]
      operationId: getAdminUser
      summary: Get user (admin)
      description: ROLE_MODERATOR. Any existing user, suspended included. Unknown id → 404.
      responses:
        '200':
          description: User.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{userId}/suspension:
    parameters:
      - $ref: '#/components/parameters/AdminUserIdPath'
    post:
      tags: [admin]
      operationId: suspendUser
      summary: Suspend user
      description: |
        ROLE_MODERATOR. Same effect as the `suspend` decision of W-33 (DATA_MODEL §13): `suspended_at = now()`, every refresh-token family deleted; the next request with a still-valid access JWT → 403 `account_suspended`. Does not touch reports.
        Order: unknown id → 404; target is self → 422 `validation_failed`; role guard (ADR 013 §2: a moderator on a moderator or admin, anyone on an admin) → 403 `forbidden`; already suspended → 422 `validation_failed`. Journaled `admin.user_suspended` with the note.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminNoteRequest' }
      responses:
        '200':
          description: User after suspension.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [admin]
      operationId: unsuspendUser
      summary: Unsuspend user
      description: |
        ROLE_MODERATOR. Clears `suspended_at`; the user logs in again (no session is restored). Same order and role guard as suspension; not suspended → 422 `validation_failed`. Journaled `admin.user_unsuspended` (with the note when given). Body optional (W-71); the back-office UI always sends a note.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminNoteRequest' }
      responses:
        '200':
          description: User after unsuspension.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/users/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/AdminUserIdPath'
    put:
      tags: [admin]
      operationId: setUserRole
      summary: Set user role
      description: |
        ROLE_ADMIN (moderator → 403 before any lookup). Moves a user between `ROLE_USER` and `ROLE_MODERATOR`; `ROLE_ADMIN` is never accepted (422 `validation_failed`: console only, ADR 013 §3).
        Order: body → 422; unknown id → 404; self or target is an admin → 403 `forbidden`; same role as current → 200 unchanged, nothing journaled. Takes effect at the target's next request. Journaled `admin.role_changed` (`from`, `to`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRoleRequest' }
      responses:
        '200':
          description: User after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/users/{userId}/activity:
    parameters:
      - $ref: '#/components/parameters/AdminUserIdPath'
    get:
      tags: [admin]
      operationId: listUserActivity
      summary: List user activity
      description: |
        ROLE_ADMIN. Journal of events whose subject or actor is the user (DATA_MODEL §15), newest first (keyset on `id` DESC), within retention (90 days, `admin.*` 1 year).
        Opening the first page (no cursor) is itself journaled as `admin.journal_viewed`. Unknown id → 404.
      parameters:
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/ActivityCategory' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityEventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/audit-log:
    get:
      tags: [admin]
      operationId: listAdminAuditLog
      summary: List admin actions
      description: ROLE_ADMIN. Every `admin.*` event (DATA_MODEL §15), newest first, optionally for one staff member (`actorId`). Retention 1 year.
      parameters:
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of admin events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityEventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/content:
    get:
      tags: [admin]
      operationId: listAdminContent
      summary: List content (admin)
      description: |
        ROLE_MODERATOR. One content type per call (`type` required), newest first (keyset on `(createdAt, id)` DESC). Hidden, private, processing and failed items included; moderators see everything.
        `q` filters on the item label (title, caption, body, name; trigram, ≥ 2 chars). Hide / restore goes through `POST /admin/report-targets/{targetType}/{targetId}/decision` (`hide` / `dismiss`), which works without open reports.
      parameters:
        - name: type
          in: query
          required: true
          schema: { $ref: '#/components/schemas/AdminContentType' }
        - name: moderation
          in: query
          schema: { $ref: '#/components/schemas/Moderation' }
        - name: ownerId
          in: query
          description: Owner (track, playlist, artist) or author (post, comment).
          schema: { type: string, format: uuid }
        - name: q
          in: query
          schema: { type: string, minLength: 2, maxLength: 100 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/content/{contentType}/{contentId}/deletion:
    parameters:
      - $ref: '#/components/parameters/AdminContentTypePath'
      - $ref: '#/components/parameters/AdminContentIdPath'
    post:
      tags: [admin]
      operationId: deleteAdminContent
      summary: Delete content (admin)
      description: |
        ROLE_ADMIN (moderator → 403 before any lookup). Irreversible hard delete with the owner's own delete rules (counters, `PurgeObjects`, reports of the target and of cascaded rows deleted, DATA_MODEL §0; a track takes the posts using it; an artist with tracks → 409 `artist_has_tracks`).
        Unknown id → 404. Journaled `admin.content_deleted` (type, id, owner id, note) in the same transaction; the owner is not notified in v1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminNoteRequest' }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/alerts:
    get:
      tags: [admin]
      operationId: listSecurityAlerts
      summary: List security alerts
      description: ROLE_ADMIN. Default `status=open`; highest severity first, then most recent `lastSeenAt` (keyset on `(severityRank DESC, lastSeenAt DESC, id)`).
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AlertStatus' }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/AlertSeverity' }
        - name: rule
          in: query
          schema: { $ref: '#/components/schemas/AlertRule' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of alerts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityAlertPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/alerts/{alertId}/acknowledgement:
    parameters:
      - name: alertId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      operationId: acknowledgeSecurityAlert
      summary: Acknowledge security alert
      description: ROLE_ADMIN. Sets `acknowledged`, author, date and note; a new hit of the same rule and subject then opens a new alert. Unknown id → 404; already acknowledged → 409 `already_acknowledged`. Journaled `admin.alert_acknowledged`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminNoteRequest' }
      responses:
        '200':
          description: Alert after acknowledgement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityAlert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/announcements:
    get:
      tags: [admin]
      operationId: listAdminAnnouncements
      summary: List announcements (admin)
      description: ROLE_ADMIN. All announcements, past, active and scheduled, newest `startsAt` first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of announcements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createAnnouncement
      summary: Create announcement
      description: ROLE_ADMIN. Plain text only (DATA_MODEL §17). `endsAt` must be after `startsAt` (422). Journaled `admin.announcement_created`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAnnouncementRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/announcements/{announcementId}:
    parameters:
      - $ref: '#/components/parameters/AnnouncementIdPath'
    patch:
      tags: [admin]
      operationId: updateAnnouncement
      summary: Update announcement
      description: ROLE_ADMIN. Partial update; bumps `updatedAt` so clients show the banner again. Unknown id → 404. Journaled `admin.announcement_updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAnnouncementRequest' }
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/UpdateAnnouncementRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [admin]
      operationId: deleteAnnouncement
      summary: Delete announcement
      description: ROLE_ADMIN. Hard delete (to end one early, PATCH `endsAt` instead). Unknown id → 404. Journaled `admin.announcement_deleted`.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── announcements ─────────────────────────────
  /announcements:
    get:
      tags: [announcements]
      operationId: listActiveAnnouncements
      summary: List active announcements
      description: Any signed-in user. Up to 3 active announcements (DATA_MODEL §17), `warning` first then newest. The client hides one the user dismissed, keyed by `id` + `updatedAt` (local storage), and renders `title`/`body` as text only.
      responses:
        '200':
          description: Active announcements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveAnnouncements' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: wave_refresh
      description: 'Web only. `HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=2592000`. Documented for reference; auth routes declare `security: []`.'

  parameters:
    WaveClient:
      name: X-Wave-Client
      in: header
      required: false
      description: '`mobile` → refresh token in JSON body, no cookie. Absent or `web` → refresh token only in the `wave_refresh` cookie (D3).'
      schema: { type: string, enum: [web, mobile], default: web }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque value from a previous `nextCursor`.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Username:
      name: username
      in: path
      required: true
      description: Unknown or suspended user → 404 `not_found` (except `DELETE /users/{username}/follow`).
      schema: { type: string, pattern: '^[a-z0-9_.]{3,30}$' }
    ArtistSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 80 }
    TrackId:
      name: trackId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HashtagName:
      name: name
      in: path
      required: true
      description: Lowercase, without `#`.
      schema: { type: string, maxLength: 50 }
    ReportTargetTypePath:
      name: targetType
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ReportTargetType' }
    ReportTargetIdPath:
      name: targetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdminUserIdPath:
      name: userId
      in: path
      required: true
      description: User id (not username); suspended users included, unknown id → 404.
      schema: { type: string, format: uuid }
    AdminContentTypePath:
      name: contentType
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AdminContentType' }
    AdminContentIdPath:
      name: contentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnnouncementIdPath:
      name: announcementId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    AuthSession:
      description: 'Session opened. Web also receives `Set-Cookie: wave_refresh=…`.'
      headers:
        Set-Cookie:
          description: Web only.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthSession' }
    BadRequest:
      description: 'Malformed body/query (`malformed_request`), bad cursor (`invalid_cursor`), bad emailed token (`account_token_invalid`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: '`unauthenticated`, `token_expired`, `invalid_credentials`, `refresh_token_invalid`, `token_reused`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: '`forbidden`, `account_suspended`, `stream_token_invalid`, `email_not_verified`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: '`not_found` (also used for resources the caller may not see).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 'State conflict, see `code`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: '`stream_token_expired`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: '`payload_too_large` (PHP check; nginx may answer a bare 413 above 32 MB).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: '`unsupported_media_type`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: '`validation_failed` (with `violations`) or a business rule code.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: '`rate_limited`.'
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ── errors ──
    ProblemCode:
      type: string
      enum:
        - malformed_request          # 400
        - invalid_cursor             # 400
        - account_token_invalid      # 400
        - unauthenticated            # 401
        - token_expired              # 401
        - invalid_credentials        # 401
        - refresh_token_invalid      # 401
        - token_reused               # 401
        - forbidden                  # 403
        - account_suspended          # 403
        - stream_token_invalid       # 403
        - email_not_verified         # 403
        - not_found                  # 404
        - email_taken                # 409
        - username_taken             # 409
        - artist_limit_reached       # 409
        - artist_has_tracks          # 409
        - track_not_ready            # 409
        - track_already_in_playlist  # 409
        - playlist_full              # 409
        - playlist_limit_reached     # 409
        - playlist_order_mismatch    # 409
        - already_reported           # 409
        - already_acknowledged       # 409 (security alert, FB-28)
        - too_many_pending_uploads   # 409
        - upload_already_used        # 409
        - upload_expired             # 409
        - upload_incomplete          # 409
        - email_already_verified     # 409
        - stream_token_expired       # 410
        - payload_too_large          # 413
        - unsupported_media_type     # 415
        - validation_failed          # 422
        - artist_required            # 422
        - clips_not_allowed          # 422
        - clip_out_of_range          # 422
        - cannot_follow_self         # 422
        - cannot_report_own          # 422
        - not_a_follower             # 422 (close friends, FB-18)
        - rate_limited               # 429
        - internal_error             # 500
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, description: '`urn:wave:problem:{code}`', example: 'urn:wave:problem:validation_failed' }
        title: { type: string, description: 'Short English summary, stable per code.' }
        status: { type: integer }
        detail: { type: string, description: 'Human-readable, may vary. Never contains internals.' }
        code: { $ref: '#/components/schemas/ProblemCode' }
        violations:
          type: array
          description: Only for `validation_failed`.
          items: { $ref: '#/components/schemas/Violation' }
    Violation:
      type: object
      required: [propertyPath, message]
      properties:
        propertyPath: { type: string, example: username }
        message: { type: string }
        code: { type: [string, 'null'], description: Symfony constraint code (UUID) for client-side mapping. }

    # ── shared ──
    Id:
      type: string
      format: uuid
      description: UUID v7.
    DateTime:
      type: string
      format: date-time
      example: '2026-10-24T08:15:30Z'
    MediaUrl:
      type: [string, 'null']
      format: uri
      description: Absolute URL under `MEDIA_PUBLIC_BASE_URL` (`…/media/{key}`), immutable content (long cache), or null.
    MediaStatus:
      type: string
      enum: [processing, ready, failed]
    FailureReason:
      type: [string, 'null']
      enum: [invalid_media, no_audio, unsupported_codec, too_long, too_large, processing_error, null]
      description: '`invalid_media` = unreadable or disguised file; `no_audio` = readable file without any audio stream (e.g. a silent video); `processing_error` = internal failure after retries.'
    Visibility:
      type: string
      enum: [public, followers, close_friends, private]
      description: 'Track audience (FB-18, ADR 012): `followers` = users following the owner; `close_friends` = the owner''s list (`/me/close-friends`), all followers; `private` = owner only.'
    Moderation:
      type: string
      enum: [visible, hidden]
    LikeState:
      type: object
      required: [liked, likeCount]
      properties:
        liked: { type: boolean }
        likeCount: { type: integer }
    FollowState:
      type: object
      required: [following, followersCount]
      properties:
        following: { type: boolean }
        followersCount: { type: integer, description: Followers of the target user. }
    CloseFriendState:
      type: object
      required: [isCloseFriend]
      properties:
        isCloseFriend: { type: boolean }
    CloseFriendItem:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [isCloseFriend]
          properties:
            isCloseFriend: { type: boolean, description: Always true with `scope=members`. }
    CloseFriendPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CloseFriendItem' } }
        nextCursor: { type: [string, 'null'] }
    StreamUrl:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri, example: 'https://wave.local/api/v1/stream/eyJr...Q.mT3...x' }
        expiresAt: { $ref: '#/components/schemas/DateTime' }

    # ── auth ──
    RegisterRequest:
      type: object
      required: [email, password, username, displayName]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 180 }
        password: { type: string, minLength: 10, maxLength: 128 }
        username: { type: string, pattern: '^[a-z0-9_.]{3,30}$' }
        displayName: { type: string, minLength: 1, maxLength: 50 }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string }
        password: { type: string }
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken: { type: string, description: Mobile only; ignored on web. }
    AccountTokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1, maxLength: 128 }
    PasswordResetRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 180 }
    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 10, maxLength: 128 }
    DeleteAccountRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string }
    AuthSession:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, const: 900 }
        refreshToken: { type: string, description: 'Mobile only (`X-Wave-Client: mobile`). Absent on web.' }
        refreshExpiresIn: { type: integer, description: 'Mobile only, seconds (2592000).' }
        user: { $ref: '#/components/schemas/Me' }

    # ── users ──
    UserSummary:
      type: object
      required: [id, username, displayName, avatarUrl]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { $ref: '#/components/schemas/MediaUrl' }
    UserListItem:
      description: Used by followers/following lists and user search; enough for an inline follow button.
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [followersCount, isMe, isFollowedByMe]
          properties:
            followersCount: { type: integer }
            isMe: { type: boolean }
            isFollowedByMe: { type: boolean }
    UserProfile:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [bio, followersCount, followingCount, createdAt, isMe, isFollowedByMe]
          properties:
            bio: { type: [string, 'null'] }
            followersCount: { type: integer }
            followingCount: { type: integer }
            createdAt: { $ref: '#/components/schemas/DateTime' }
            isMe: { type: boolean }
            isFollowedByMe: { type: boolean }
    Me:
      allOf:
        - $ref: '#/components/schemas/UserProfile'
        - type: object
          required: [email, emailVerified, roles]
          properties:
            email: { type: string, format: email }
            emailVerified: { type: boolean }
            roles:
              type: array
              items: { type: string, enum: [ROLE_USER, ROLE_MODERATOR, ROLE_ADMIN] }
    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 50 }
        bio: { type: [string, 'null'], maxLength: 300 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 10, maxLength: 128 }
    ImageUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: JPEG, PNG or WebP, ≤ 5 MB (5242880 bytes).

    # ── artists / genres ──
    ArtistSummary:
      type: object
      required: [id, slug, name, avatarUrl]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { type: string }
        name: { type: string }
        avatarUrl: { $ref: '#/components/schemas/MediaUrl' }
    Artist:
      allOf:
        - $ref: '#/components/schemas/ArtistSummary'
        - type: object
          required: [bio, trackCount, owner, moderation, isOwner, createdAt]
          properties:
            bio: { type: [string, 'null'] }
            trackCount: { type: integer, description: 'Public, ready, visible tracks.' }
            owner: { $ref: '#/components/schemas/UserSummary' }
            moderation: { $ref: '#/components/schemas/Moderation' }
            isOwner: { type: boolean }
            createdAt: { $ref: '#/components/schemas/DateTime' }
    CreateArtistRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        bio: { type: [string, 'null'], maxLength: 1000 }
    UpdateArtistRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        bio: { type: [string, 'null'], maxLength: 1000 }
    Genre:
      type: object
      required: [id, name]
      properties:
        id: { type: string, example: rap-fr, description: Stable slug. }
        name: { type: string, example: 'Rap français', description: French display name. }

    # ── tracks ──
    Track:
      type: object
      required: [id, title, artist, owner, genre, coverUrl, durationMs, status, failureReason, visibility, allowClips, moderation, playCount, likeCount, likedByMe, isOwner, canClip, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        artist: { $ref: '#/components/schemas/ArtistSummary' }
        owner: { $ref: '#/components/schemas/UserSummary' }
        genre: { $ref: '#/components/schemas/Genre' }
        coverUrl: { $ref: '#/components/schemas/MediaUrl' }
        durationMs: { type: [integer, 'null'], description: Null while processing. }
        status: { $ref: '#/components/schemas/MediaStatus' }
        failureReason: { $ref: '#/components/schemas/FailureReason' }
        visibility:
          oneOf:
            - $ref: '#/components/schemas/Visibility'
            - type: 'null'
          description: 'Real audience for the owner and moderators. Anyone else gets `public`, or null for a restricted track they are allowed to see (the audience is not disclosed, ADR 012).'
        allowClips: { type: boolean }
        moderation: { $ref: '#/components/schemas/Moderation' }
        playCount: { type: integer }
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        isOwner: { type: boolean }
        canClip: { type: boolean, description: Caller may create a post from this track now (D5). }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    CreateTrackUploadRequest:
      type: object
      required: [filename, size, contentType]
      additionalProperties: false
      properties:
        filename: { type: string, minLength: 1, maxLength: 255, description: 'Original name; only its extension is used (`mp3`, `m4a`, `aac`, `mp4`).' }
        size: { type: integer, minimum: 1, maximum: 209715200, description: Declared bytes. }
        contentType: { type: string, enum: [audio/mpeg, audio/mp4, audio/aac, audio/x-m4a, video/mp4] }
    TrackUploadSlot:
      type: object
      required: [uploadId, method, url, fields, maxBytes, expiresAt]
      properties:
        uploadId: { $ref: '#/components/schemas/Id' }
        method: { type: string, const: POST }
        url: { type: string, format: uri, description: 'Dev: `http://localhost:8090/upload/wave-private`; prod: the S3 bucket endpoint.' }
        fields:
          type: object
          description: Form fields to send verbatim before `file` (key, policy, x-amz-algorithm, x-amz-credential, x-amz-date, x-amz-signature…).
          additionalProperties: { type: string }
        maxBytes: { type: integer }
        expiresAt: { $ref: '#/components/schemas/DateTime' }
    CreateTrackRequest:
      type: object
      required: [uploadId, title, genreId]
      additionalProperties: false
      properties:
        uploadId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        genreId: { type: string }
        artistId: { type: string, format: uuid }
        visibility: { $ref: '#/components/schemas/Visibility' }
        allowClips: { type: boolean, default: true }
    UpdateTrackRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        genreId: { type: string }
        artistId: { type: string, format: uuid }
        visibility: { $ref: '#/components/schemas/Visibility' }
        allowClips: { type: boolean }
    ListenRequest:
      type: object
      required: [listenedMs, source]
      additionalProperties: false
      properties:
        listenedMs: { type: integer, minimum: 0, maximum: 3600000, description: 'Actual audio time played (not wall clock, seeks excluded).' }
        source: { type: string, enum: [player, feed] }
        postId: { type: string, format: uuid, description: 'Required when source=feed (phase 3); must be a post of this track playable for the caller (DATA_MODEL §9, viewer-dependent), else 422. Forbidden with source=player.' }
    ListenResult:
      type: object
      required: [counted, playCount]
      properties:
        counted: { type: boolean }
        playCount: { type: integer }

    # ── playlists ──
    Playlist:
      type: object
      required: [id, name, description, isPublic, owner, coverUrl, itemCount, likeCount, likedByMe, moderation, isOwner, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        description: { type: [string, 'null'] }
        isPublic: { type: boolean }
        owner: { $ref: '#/components/schemas/UserSummary' }
        coverUrl: { $ref: '#/components/schemas/MediaUrl' }
        itemCount: { type: integer }
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        moderation: { $ref: '#/components/schemas/Moderation' }
        isOwner: { type: boolean }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    CreatePlaylistRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 300 }
        isPublic: { type: boolean, default: true }
    UpdatePlaylistRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 300 }
        isPublic: { type: boolean }
    PlaylistItem:
      type: object
      required: [trackId, position, addedAt, track]
      properties:
        trackId: { $ref: '#/components/schemas/Id' }
        position: { type: integer, minimum: 0 }
        addedAt: { $ref: '#/components/schemas/DateTime' }
        track:
          oneOf:
            - $ref: '#/components/schemas/Track'
            - type: 'null'
          description: Null when the track is no longer visible to the caller (owner only; such items are omitted for non-owners).
    AddPlaylistItemRequest:
      type: object
      required: [trackId]
      additionalProperties: false
      properties:
        trackId: { type: string, format: uuid }
    ReorderPlaylistRequest:
      type: object
      required: [trackIds]
      additionalProperties: false
      properties:
        trackIds:
          type: array
          description: Must be a JSON array (list); an object → 422 `validation_failed`.
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }

    # ── posts ──
    PostVisual:
      type: object
      required: [type, url, posterUrl]
      properties:
        type: { type: string, enum: [image, video] }
        url: { type: string, format: uri }
        posterUrl: { type: [string, 'null'], format: uri, description: Video only. }
    Post:
      type: object
      required: [id, author, track, clipStartMs, clipDurationMs, clip, visual, caption, hashtags, status, failureReason, moderation, likeCount, commentCount, viewCount, likedByMe, isOwner, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        author: { $ref: '#/components/schemas/UserSummary' }
        track: { $ref: '#/components/schemas/Track' }
        clipStartMs: { type: integer, minimum: 0 }
        clipDurationMs: { type: integer, minimum: 15000, maximum: 60000 }
        clip:
          oneOf:
            - $ref: '#/components/schemas/StreamUrl'
            - type: 'null'
          description: Signed clip URL (TTL 5 min, ADR 001 token kind `c`) embedded to avoid one call per post; null unless ready and visible to the caller. Issuing it records the caller's listen grant for the track (DATA_MODEL §11). Expired, or `/stream` answers 403/410 → `GET /posts/{id}/stream-url`.
        visual:
          oneOf:
            - $ref: '#/components/schemas/PostVisual'
            - type: 'null'
          description: Null when no visual or not processed yet; client falls back to `track.coverUrl`.
        caption: { type: [string, 'null'] }
        hashtags:
          type: array
          items: { type: string }
        status: { $ref: '#/components/schemas/MediaStatus' }
        failureReason: { $ref: '#/components/schemas/FailureReason' }
        moderation: { $ref: '#/components/schemas/Moderation' }
        likeCount: { type: integer }
        commentCount: { type: integer }
        viewCount: { type: integer }
        likedByMe: { type: boolean }
        isOwner: { type: boolean }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    PostUpload:
      type: object
      required: [trackId, clipStartMs, clipDurationMs]
      properties:
        trackId: { type: string, format: uuid }
        clipStartMs: { type: integer, minimum: 0 }
        clipDurationMs: { type: integer, minimum: 15000, maximum: 60000 }
        caption: { type: string, maxLength: 300 }
        visual:
          type: string
          contentMediaType: application/octet-stream
          description: Optional. Image ≤ 5 MB (jpg/png/webp) or MP4 ≤ 15 MB (15728640 bytes), ≤ 60 s.
    Comment:
      type: object
      required: [id, postId, author, body, moderation, createdAt, canDelete]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        postId: { $ref: '#/components/schemas/Id' }
        author: { $ref: '#/components/schemas/UserSummary' }
        body: { type: string }
        moderation: { $ref: '#/components/schemas/Moderation' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        canDelete: { type: boolean }
    CreateCommentRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 500 }
    PostViewsRequest:
      type: object
      required: [views]
      additionalProperties: false
      properties:
        views:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [postId, watchedMs]
            additionalProperties: false
            properties:
              postId: { type: string, format: uuid }
              watchedMs: { type: integer, minimum: 0, maximum: 600000 }

    # ── search ──
    SearchType:
      type: string
      enum: [tracks, artists, users, playlists, hashtags]
    Hashtag:
      type: object
      required: [name, postCount]
      properties:
        name: { type: string, example: lofi }
        postCount: { type: integer }
    SearchResults:
      type: object
      description: Sections present according to `type` (see operation).
      properties:
        tracks: { $ref: '#/components/schemas/TrackPage' }
        artists: { $ref: '#/components/schemas/ArtistPage' }
        users: { $ref: '#/components/schemas/UserPage' }
        playlists: { $ref: '#/components/schemas/PlaylistPage' }
        hashtags: { $ref: '#/components/schemas/HashtagPage' }

    # ── notifications (FB-16, W-45) ──
    NotificationType:
      type: string
      enum: [follow, track_like, playlist_like, post_like, comment]
    NotificationTarget:
      type: object
      description: The caller's own content the event is about. Null for `follow`.
      required: [type, id, label, imageUrl]
      properties:
        type: { type: string, enum: [track, playlist, post] }
        id: { $ref: '#/components/schemas/Id' }
        label: { type: string, description: 'Track title, playlist name, or post caption truncated to 80 chars (track title when no caption). Plain text.' }
        imageUrl: { $ref: '#/components/schemas/MediaUrl', description: 'Track cover; post visual (poster for video) else its track cover; playlist: cover of its first available item.' }
    Notification:
      type: object
      required: [id, type, actors, actorCount, target, read, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/NotificationType' }
        actors:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/UserSummary' }
          description: Most recent non-suspended actors first; never empty.
        actorCount: { type: integer, minimum: 1 }
        target:
          oneOf:
            - $ref: '#/components/schemas/NotificationTarget'
            - type: 'null'
        read: { type: boolean }
        updatedAt:
          allOf: [{ $ref: '#/components/schemas/DateTime' }]
          description: 'Microsecond precision (unlike other dates, which are to the second); send it back unchanged as `upTo` of `POST /me/notifications/read`.'
          example: '2026-11-12T10:19:20.006574+00:00'
    NotificationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        nextCursor: { type: [string, 'null'] }
    UnreadNotificationCount:
      type: object
      required: [unreadCount]
      properties:
        unreadCount: { type: integer, minimum: 0, maximum: 100 }
    MarkNotificationsReadRequest:
      type: object
      additionalProperties: false
      required: [upTo]
      properties:
        upTo:
          allOf: [{ $ref: '#/components/schemas/DateTime' }]
          description: '`updatedAt` (microsecond precision) of the newest item displayed, sent back unchanged; compared exactly. A date with 0 to 6 decimals is accepted.'
          example: '2026-11-12T10:19:20.006574+00:00'

    # ── reports ──
    ReportTargetType:
      type: string
      enum: [track, post, comment, playlist, artist, user]
    ReportReason:
      type: string
      enum: [spam, harassment, hate, sexual, violence, copyright, impersonation, other]
    ReportStatus:
      type: string
      enum: [open, actioned, dismissed]
    CreateReportRequest:
      type: object
      required: [targetType, targetId, reason]
      additionalProperties: false
      properties:
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetId: { type: string, format: uuid }
        reason: { $ref: '#/components/schemas/ReportReason' }
        details: { type: [string, 'null'], maxLength: 1000 }
    ReportReceipt:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/ReportStatus' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    Report:
      type: object
      required: [id, reporter, targetType, targetId, reason, details, status, handledBy, handledAt, decisionNote, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        reporter: { $ref: '#/components/schemas/UserSummary' }
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetId: { $ref: '#/components/schemas/Id' }
        reason: { $ref: '#/components/schemas/ReportReason' }
        details: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ReportStatus' }
        handledBy:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        handledAt: { type: [string, 'null'], format: date-time }
        decisionNote: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    ReportTarget:
      type: object
      required: [targetType, targetId, preview, moderation, openReportCount, reasons, firstReportedAt, lastReportedAt]
      properties:
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetId: { $ref: '#/components/schemas/Id' }
        preview:
          type: [object, 'null']
          description: Null when the target was deleted.
          required: [label]
          properties:
            label: { type: string, description: 'Track title, post caption, comment body (truncated 140), playlist/artist name, or username.' }
            imageUrl: { $ref: '#/components/schemas/MediaUrl' }
            owner: { $ref: '#/components/schemas/UserSummary' }
        moderation:
          type: [string, 'null']
          enum: [visible, hidden, null]
          description: Null for user targets.
        suspended: { type: [boolean, 'null'], description: User targets only. }
        openReportCount: { type: integer }
        reasons:
          type: object
          description: Count of open reports per reason.
          additionalProperties: { type: integer }
        firstReportedAt: { $ref: '#/components/schemas/DateTime' }
        lastReportedAt: { $ref: '#/components/schemas/DateTime' }
    ModerationDecisionRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action: { type: string, enum: [hide, dismiss, suspend] }
        note: { type: [string, 'null'], maxLength: 500 }

    # ── admin back-office (FB-28, ADR 013) ──
    AdminRole:
      type: string
      enum: [ROLE_USER, ROLE_MODERATOR, ROLE_ADMIN]
      description: Highest role of the user.
    AdminUser:
      type: object
      required: [id, username, displayName, avatarUrl, email, emailVerified, role, suspendedAt, createdAt, lastLoginAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { $ref: '#/components/schemas/MediaUrl' }
        email: { type: [string, 'null'], format: email, description: Null for a moderator caller. }
        emailVerified: { type: boolean }
        role: { $ref: '#/components/schemas/AdminRole' }
        suspendedAt: { type: [string, 'null'], format: date-time }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        lastLoginAt: { type: [string, 'null'], format: date-time }
    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUser'
        - type: object
          required: [counts, openReportCount, openAlertCount, lastSuspension]
          properties:
            counts:
              type: object
              required: [tracks, posts, comments, playlists, artists, followers, following, reportsFiled]
              properties:
                tracks: { type: integer }
                posts: { type: integer }
                comments: { type: integer }
                playlists: { type: integer }
                artists: { type: integer }
                followers: { type: integer }
                following: { type: integer }
                reportsFiled: { type: integer }
            openReportCount: { type: integer, description: Open reports on the user and on their content. }
            openAlertCount: { type: [integer, 'null'], description: Open alerts about the user; null for a moderator caller. }
            lastSuspension:
              description: Latest `admin.user_suspended` event within retention, else null.
              oneOf:
                - type: object
                  required: [at, by, note]
                  properties:
                    at: { $ref: '#/components/schemas/DateTime' }
                    by:
                      oneOf:
                        - $ref: '#/components/schemas/UserSummary'
                        - type: 'null'
                    note: { type: [string, 'null'] }
                - type: 'null'
    SetRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { type: string, enum: [ROLE_USER, ROLE_MODERATOR] }
        note: { type: [string, 'null'], maxLength: 500 }
    AdminNoteRequest:
      type: object
      required: [note]
      additionalProperties: false
      properties:
        note: { type: string, minLength: 1, maxLength: 500, description: 'Reason, written to the audit journal.' }
    ActivityCategory:
      type: string
      enum: [auth, account, content, report, upload, abuse, admin]
    ActivityEvent:
      type: object
      required: [id, category, type, actor, subjectUser, targetType, targetId, ipPrefix, ipHash, userAgent, metadata, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        category: { $ref: '#/components/schemas/ActivityCategory' }
        type: { type: string, description: 'Closed list in DATA_MODEL §15, e.g. `auth.login_failed`, `admin.user_suspended`.', maxLength: 40 }
        actor:
          description: Null = anonymous or console.
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        subjectUser:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        targetType: { type: [string, 'null'] }
        targetId: { type: [string, 'null'], format: uuid }
        ipPrefix: { type: [string, 'null'], description: 'Truncated address (`203.0.113.0/24`, IPv6 /48), never the full IP.' }
        ipHash: { type: [string, 'null'], description: 'Hex of the keyed IP hash (32 chars), only to compare events; not reversible.' }
        userAgent: { type: [string, 'null'], maxLength: 200 }
        metadata:
          type: object
          description: Ids, enum values, counts and staff `note` only (DATA_MODEL §15).
          additionalProperties: true
        createdAt: { $ref: '#/components/schemas/DateTime' }
    AdminContentType:
      type: string
      enum: [track, post, comment, playlist, artist]
    AdminContentItem:
      type: object
      required: [type, id, label, imageUrl, owner, moderation, status, visibility, openReportCount, createdAt]
      properties:
        type: { $ref: '#/components/schemas/AdminContentType' }
        id: { $ref: '#/components/schemas/Id' }
        label: { type: string, description: 'Title, caption, body (truncated 140) or name.' }
        imageUrl: { $ref: '#/components/schemas/MediaUrl' }
        owner: { $ref: '#/components/schemas/UserSummary' }
        moderation: { $ref: '#/components/schemas/Moderation' }
        status:
          type: [string, 'null']
          enum: [processing, ready, failed, null]
          description: Media status for tracks and posts; null otherwise.
        visibility:
          type: [string, 'null']
          enum: [public, followers, close_friends, private, null]
          description: Real track visibility, or `public`/`private` for playlists; null otherwise.
        openReportCount: { type: integer }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    AlertRule:
      type: string
      enum: [login_failures, token_reuse, mass_registration, report_burst, report_spree, upload_abuse, rate_limit_hammering, privilege_granted]
    AlertSeverity:
      type: string
      enum: [low, medium, high]
    AlertStatus:
      type: string
      enum: [open, acknowledged]
    SecurityAlert:
      type: object
      required: [id, rule, severity, subjectUser, subjectIpHash, subjectTarget, hitCount, firstSeenAt, lastSeenAt, status, acknowledgedBy, acknowledgedAt, note]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        rule: { $ref: '#/components/schemas/AlertRule' }
        severity: { $ref: '#/components/schemas/AlertSeverity' }
        subjectUser:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        subjectIpHash: { type: [string, 'null'], description: 'Hex keyed hash, to filter the journal; never the IP.' }
        subjectTarget:
          oneOf:
            - type: object
              required: [targetType, targetId]
              properties:
                targetType: { $ref: '#/components/schemas/ReportTargetType' }
                targetId: { $ref: '#/components/schemas/Id' }
            - type: 'null'
        hitCount: { type: integer, minimum: 1 }
        firstSeenAt: { $ref: '#/components/schemas/DateTime' }
        lastSeenAt: { $ref: '#/components/schemas/DateTime' }
        status: { $ref: '#/components/schemas/AlertStatus' }
        acknowledgedBy:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        acknowledgedAt: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }
    AnnouncementLevel:
      type: string
      enum: [info, warning]
    Announcement:
      type: object
      required: [id, title, body, level, startsAt, endsAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string, maxLength: 80 }
        body: { type: string, maxLength: 500, description: 'Plain text; render as text, never as HTML.' }
        level: { $ref: '#/components/schemas/AnnouncementLevel' }
        startsAt: { $ref: '#/components/schemas/DateTime' }
        endsAt: { type: [string, 'null'], format: date-time }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    CreateAnnouncementRequest:
      type: object
      required: [title, body, level]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        body: { type: string, minLength: 1, maxLength: 500 }
        level: { $ref: '#/components/schemas/AnnouncementLevel' }
        startsAt: { type: [string, 'null'], format: date-time, description: Default now. }
        endsAt: { type: [string, 'null'], format: date-time }
    UpdateAnnouncementRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        body: { type: string, minLength: 1, maxLength: 500 }
        level: { $ref: '#/components/schemas/AnnouncementLevel' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
    ActiveAnnouncements:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Announcement' }
    AdminDashboard:
      type: object
      required: [users, moderation, content, alerts, announcements, generatedAt]
      properties:
        users:
          description: Null for a moderator caller (ADR 013, F30).
          oneOf:
            - type: object
              required: [total, new24h, new7d, suspended, unverified, moderators, admins]
              properties:
                total: { type: integer }
                new24h: { type: integer }
                new7d: { type: integer }
                suspended: { type: integer }
                unverified: { type: integer }
                moderators: { type: integer }
                admins: { type: integer }
            - type: 'null'
        moderation:
          type: object
          required: [openReportTargets, openReports, hiddenContent24h]
          properties:
            openReportTargets: { type: integer }
            openReports: { type: integer }
            hiddenContent24h: { type: integer, description: Auto-hides and staff hides in the last 24 h. }
        content:
          description: Null for a moderator caller (ADR 013, F30).
          oneOf:
            - type: object
              required: [tracks24h, posts24h, comments24h, failedUploads24h]
              properties:
                tracks24h: { type: integer }
                posts24h: { type: integer }
                comments24h: { type: integer }
                failedUploads24h: { type: integer }
            - type: 'null'
        alerts:
          description: Null for a moderator caller.
          oneOf:
            - type: object
              required: [open, openHigh, openMedium, openLow]
              properties:
                open: { type: integer }
                openHigh: { type: integer }
                openMedium: { type: integer }
                openLow: { type: integer }
            - type: 'null'
        announcements:
          description: Null for a moderator caller.
          oneOf:
            - type: object
              required: [active, scheduled]
              properties:
                active: { type: integer }
                scheduled: { type: integer }
            - type: 'null'
        generatedAt: { $ref: '#/components/schemas/DateTime' }

