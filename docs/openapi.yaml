openapi: 3.1.0
info:
  title: Wave API
  version: 1.0.0
  summary: Social music API (library, player, vertical feed).
  description: |
    Contract v1. Owned by architect; any change goes through architect (BRIEF).

    Global rules (details in docs/CONVENTIONS.md):
    - Base path `/api/v1`. JSON only (`application/json`), camelCase, no Hydra/JSON-LD.
    - Ids are UUID v7 strings, except genres (slug), users in paths (username), artists in paths (slug), hashtags (name).
    - Dates are ISO 8601 UTC with `Z` (`2026-10-24T08:15:30Z`).
    - Errors are RFC 7807 `application/problem+json` with a stable `code` (see `ProblemCode`); `type` = `urn:wave:problem:{code}`.
    - Lists use cursor pagination: `?cursor=&limit=` (limit default 20, max 50 unless stated); response `{items, nextCursor}`; `nextCursor: null` = last page. Cursors are opaque; a tampered cursor → 400 `invalid_cursor`.
    - Every endpoint requires `Authorization: Bearer <access JWT>` unless it declares `security: []`. Access JWT TTL 15 min.
    - Track audiences (FB-18, ADR 012, DATA_MODEL §6): `visibility` ∈ `public`, `followers`, `close_friends` (the owner's list, `/me/close-friends`), `private` (owner only). A track outside the caller's audience is invisible (404, same bytes as an unknown id); posts on the owner's own track share the track's audience (`playable` is viewer-dependent, DATA_MODEL §9). Unfollowing or leaving a close-friends list takes effect at the next request.
    - Visibility: a resource the caller may not see (track of someone else outside the caller's audience, hidden by moderation, not ready and not owned, non-playable post) answers **404 `not_found`**, never 403. 403 is only for resources the caller can see but may not mutate.
    - Rate-limited routes declare `x-rate-limit` and may answer 429 with `Retry-After` (seconds).
    - Unverified accounts (`emailVerified: false`) may browse, stream, like, follow, manage playlists; operations tagged `x-requires-verified-email: true` answer 403 `email_not_verified` for them.
    - Unsupported method on an existing path (405) is answered as 404 `not_found`, so the route map is not disclosed.
    - Body with a missing required field or wrong JSON type → 400 `malformed_request` on auth routes (`/auth/*`, deserialized before validation); 422 `validation_failed` elsewhere.
    - An `artistId` (or any referenced id) the caller does not own or cannot see → 404 `not_found`, in bodies as in paths.
    - Suspended accounts (W-26 F16): every `/users/{username}` route answers 404 `not_found` for a suspended user (profile, lists, follow), except `DELETE …/follow`; suspended users are left out of followers/following lists (counters unchanged until phase 5 moderation).
    - Removing one's own link (W-26 F14): `DELETE …/like` removes the caller's like whatever the target's visibility (counter decremented); if the caller has no like on it, an invisible target answers 404 like a nonexistent one (no existence oracle, T17). `DELETE /users/{username}/follow` succeeds on any existing user, suspended included; 404 only for an unknown username.
    - PATCH bodies are partial JSON (merge-patch semantics); `application/json` and `application/merge-patch+json` are both accepted.
    - Content of suspended accounts (phase 3): posts whose author is suspended are not playable (404, left out of every feed and list); comments by suspended authors are left out of comment lists. Tracks, playlists and artists of suspended owners stay as in phase 2 until phase 5 (W-26 F18).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: me
  - name: users
  - name: artists
  - name: genres
  - name: tracks
  - name: stream
  - name: playlists
  - name: posts
  - name: feed
  - name: search
  - name: reports
  - name: admin
  - name: announcements

paths:
  # ───────────────────────────── auth ─────────────────────────────
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account and open a session
      security: []
      x-rate-limit: 5 per hour per IP
      parameters:
        - $ref: '#/components/parameters/WaveClient'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          $ref: '#/components/responses/AuthSession'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password
      description: Wrong email or password both answer 401 `invalid_credentials` (no user enumeration). Missing `email`/`password` or non-string value → 400 `malformed_request`. Suspended account → 403 `account_suspended`.
      security: []
      x-rate-limit: 5 per minute per IP+email; 20 per 15 minutes per IP
      parameters:
        - $ref: '#/components/parameters/WaveClient'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate the refresh token and get a new access token
      description: |
        Web (no `X-Wave-Client: mobile`): refresh token read from the `wave_refresh` cookie, body ignored; new cookie set.
        Mobile (`X-Wave-Client: mobile`): refresh token read from the body; new token returned in the body; no cookie.
        Tokens are single-use and rotate within a **family** (one family = one login session, ADR 008).
        Unknown or expired → 401 `refresh_token_invalid`. An already-rotated token (reuse, i.e. probable theft) → the **whole family is revoked** (every descendant, so the legitimate holder is logged out too) and 401 `token_reused`. Web: cookie cleared in both cases.
      security: []
      x-rate-limit: 30 per minute per IP
      parameters:
        - $ref: '#/components/parameters/WaveClient'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current refresh token
      description: Idempotent. Reads the token like `/auth/refresh`; deletes it if found; web clears the cookie (`Max-Age=0`). Always 204.
      security: []
      parameters:
        - $ref: '#/components/parameters/WaveClient'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204':
          description: Logged out.
          headers:
            Set-Cookie:
              description: Web only, clears `wave_refresh`.
              schema: { type: string }

  /auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm email ownership with the emailed token
      description: 'Token from the link `{FRONT_PUBLIC_URL}/verify-email?token=…` (the front page posts it here). Unknown, expired or used → 400 `account_token_invalid`. Already verified with a valid token → 204 (idempotent).'
      security: []
      x-rate-limit: 10 per minute per IP (bucket `verify_email`, separate from reset confirm)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountTokenRequest' }
      responses:
        '204': { description: Email verified. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a password reset email
      description: |
        Anti-enumeration: always 202 with an empty body, whether the email exists, is suspended or not. The request only dispatches `SendPasswordResetEmail{email}`; the worker looks the user up, issues the token (TTL 1 h) and sends the mail, so response time does not depend on existence.
      security: []
      x-rate-limit: 3 per hour per email (normalized lowercase) and 10 per hour per IP (bucket `password_reset`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202': { description: Accepted (always). }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Set a new password with the emailed token
      description: Token from `{FRONT_PUBLIC_URL}/reset-password?token=…`. Sets the password, marks the email verified if it was not, revokes every refresh token. Does not open a session (client then logs in). Bad token → 400 `account_token_invalid`.
      security: []
      x-rate-limit: 10 per 15 minutes per IP (bucket `password_reset_confirm`, separate from verify-email)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── me ─────────────────────────────
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Get me
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Update me
      description: Username and email are immutable in v1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [me]
      operationId: deleteMe
      summary: Delete my account (GDPR erasure)
      description: |
        Hard delete of the account and everything it authored (DATA_MODEL §13b, ADR 007), including other users' posts made from my tracks. Irreversible.
        Requires the current password (wrong → 422 `validation_failed` on `password`). Revokes all sessions; web cookie cleared. A confirmation email is sent to the former address.
      x-rate-limit: 5 per 15 minutes per user (bucket `account_delete`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204':
          description: Account deleted.
          headers:
            Set-Cookie:
              description: Web only, clears `wave_refresh`.
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/email-verification:
    post:
      tags: [me]
      operationId: resendEmailVerification
      summary: Send a new verification email
      description: Invalidates previous unused verification tokens, issues a new one (TTL 24 h) asynchronously. Already verified → 409 `email_already_verified`.
      x-rate-limit: 3 per hour per user (bucket `verification_resend`)
      responses:
        '202': { description: Email queued. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/password:
    post:
      tags: [me]
      operationId: changePassword
      summary: Change password
      description: |
        Revokes the refresh-token families of every **other** session (identified by the `sid` claim of the access JWT); the current session survives and is rotated: the response carries a new access token and a new refresh token (cookie on web, body on mobile), exactly like `/auth/refresh`.
        Wrong current password → 422 `validation_failed` on `currentPassword`. (Password **reset** confirm, by contrast, revokes all sessions.)
      x-rate-limit: 5 per 15 minutes per user
      parameters:
        - $ref: '#/components/parameters/WaveClient'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/avatar:
    post:
      tags: [me]
      operationId: uploadMyAvatar
      x-requires-verified-email: true
      summary: Upload my avatar
      description: Async. Returns 202 with the user unchanged; `avatarUrl` switches when processing succeeds. Invalid image (detected by worker) is dropped silently and the previous avatar is kept.
      x-rate-limit: 30 image uploads per hour per user (shared bucket `image_upload`)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImageUpload' }
            encoding:
              file: { contentType: 'image/jpeg, image/png, image/webp' }
      responses:
        '202':
          description: Accepted for processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [me]
      operationId: deleteMyAvatar
      summary: Delete my avatar
      responses:
        '204': { description: Avatar removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/likes/tracks:
    get:
      tags: [me]
      operationId: listMyLikedTracks
      summary: List my liked tracks
      description: Ordered by like date desc. Tracks no longer visible to me are omitted (audience change, unfollow, removal from close friends included).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of tracks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/close-friends:
    get:
      tags: [me]
      operationId: listMyCloseFriends
      summary: List my close friends, or my followers with their close-friend flag
      description: |
        FB-18, ADR 012. The caller's own list only (no route reads another user's list).
        `scope=members` (default): members, newest addition first, keyset on (addedAt, id).
        `scope=followers`: every follower of the caller (picker of the track form), newest follow first, keyset on (follow createdAt, id), each with `isCloseFriend`.
        Suspended users are omitted in both scopes. The cursor is bound to `scope` (reused with the other → 400 `invalid_cursor`); unknown `scope` value → 400 `malformed_request`.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [members, followers], default: members }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloseFriendPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/close-friends/{username}:
    parameters:
      - $ref: '#/components/parameters/Username'
    put:
      tags: [me]
      operationId: addCloseFriend
      summary: Add a follower to my close friends
      description: Idempotent. Unknown or suspended username → 404 `not_found`. The user must follow the caller (yourself included, since you cannot follow yourself) → else 422 `not_a_follower`, also when a concurrent unfollow wins. Applies at once to every `close_friends` track of the caller and their posts.
      x-rate-limit: shared bucket `social_write`
      responses:
        '200':
          description: Membership state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloseFriendState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [me]
      operationId: removeCloseFriend
      summary: Remove a user from my close friends
      description: Idempotent (200 with `isCloseFriend` false when not a member). Works on a suspended user too; 404 only for an unknown username. Access to the caller's `close_friends` tracks and their posts ends at the removed user's next request.
      responses:
        '200':
          description: Membership state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloseFriendState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/likes/playlists:
    get:
      tags: [me]
      operationId: listMyLikedPlaylists
      summary: List my liked playlists
      description: Ordered by like date desc. Playlists no longer visible to me (made private, hidden) are omitted.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of playlists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/notifications:
    get:
      tags: [me]
      operationId: listMyNotifications
      summary: List my notifications
      description: |
        In-app notifications of the caller (FB-16, W-45), read and unread, ordered by `updatedAt` desc then id desc (keyset). One item aggregates every actor of the same event type on the same target while it is unread ("Alice et 3 autres ont aimé ton morceau"); once read, a new event opens a new item.
        Items whose target is no longer visible to the caller (rules of the target's own endpoint: e.g. a post on a track the caller can no longer see) or whose actors are all suspended or deleted are omitted. `actors` = up to 3 most recent non-suspended actors; `actorCount` counts non-suspended actors.
        An item may move to the top between two pages when a new actor joins it: clients dedupe by id. `limit` default 20, max 50.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of notifications.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/notifications/unread-count:
    get:
      tags: [me]
      operationId: getMyUnreadNotificationCount
      summary: Get my unread notification count
      description: Number of unread items that `GET /me/notifications` would list (same omissions), capped at 100 (the client shows "99+" from 100). Polled by the client (every 60 s while visible and on focus).
      x-rate-limit: 120 per minute per user (bucket `notifications`)
      responses:
        '200':
          description: Unread count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadNotificationCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/notifications/read:
    post:
      tags: [me]
      operationId: markMyNotificationsRead
      summary: Mark my notifications read
      description: Marks read every unread notification of the caller with `updatedAt ≤ upTo` (the client sends back, unchanged, the `updatedAt` string of the newest item it displayed, so an event arriving meanwhile stays unread). Notification `updatedAt` carries microseconds (e.g. `2026-11-12T10:19:20.006574+00:00`) and the comparison is exact, so the client must not parse and re-serialize it (a JS `Date` would truncate to milliseconds). Idempotent; no id in the request, so nothing about other users can be probed. Unknown JSON field → 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkNotificationsReadRequest' }
      responses:
        '204': { description: Marked read. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ───────────────────────────── users ─────────────────────────────
  /users/{username}:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [users]
      operationId: getUserProfile
      summary: Get user profile
      description: Suspended user → 404 `not_found`.
      responses:
        '200':
          description: Public profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{username}/followers:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [users]
      operationId: listFollowers
      summary: List followers
      description: Ordered by follow date desc. Suspended users are omitted (`followersCount` still includes them). Suspended target → 404.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{username}/following:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [users]
      operationId: listFollowing
      summary: List following
      description: Ordered by follow date desc. Suspended users are omitted (`followingCount` still includes them). Suspended target → 404.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{username}/follow:
    parameters:
      - $ref: '#/components/parameters/Username'
    put:
      tags: [users]
      operationId: followUser
      summary: Follow user
      description: Idempotent. Following yourself → 422 `cannot_follow_self`. Suspended target → 404 `not_found`.
      x-rate-limit: 200 per hour per user (shared bucket `social_write`)
      responses:
        '200':
          description: Follow state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [users]
      operationId: unfollowUser
      summary: Unfollow user
      description: Idempotent. Works on a suspended target too (removes one's own link, counters decremented); 404 only for an unknown username.
      responses:
        '200':
          description: Follow state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{username}/tracks:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [users]
      operationId: listUserTracks
      summary: List user tracks
      description: All artists of the user, newest first. Others see the tracks visible to them (ready, not hidden, caller in the track's audience, DATA_MODEL §6); the owner sees every own track (any status/visibility/moderation).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of tracks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
