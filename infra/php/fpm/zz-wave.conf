; Wave FPM pool overrides (ADR 006). Loaded after www.conf / zz-docker.conf.
; Verify with: docker compose exec php php-fpm -tt
[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
; The master runs as www-data (USER in the image): user/group are ignored.
listen = 9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Container limit 512M, ~64 MB per child, headroom for the master and opcache.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 1000
request_terminate_timeout = 60s

ping.path = /fpm-ping
ping.response = pong

php_admin_value[session.upload_progress.enabled] = 0
php_admin_value[post_max_size] = 32M
php_admin_value[upload_max_filesize] = 30M
php_admin_value[max_file_uploads] = 2
php_admin_value[memory_limit] = 256M
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_include] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
