; Worker (php-cli, messenger:consume). ADR 006: 512M, no FPM, keeps proc_open.
memory_limit = 512M
max_execution_time = 0
; Temp files (ObjectStorage::downloadToTemp, ffmpeg outputs) go to the disk
; volume, not to the small /tmp tmpfs (ADR 009: inputs up to 200 MB).
sys_temp_dir = ${MEDIA_TMP_DIR}
