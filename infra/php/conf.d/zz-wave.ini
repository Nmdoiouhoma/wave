; Wave PHP settings shared by php (FPM) and worker (CLI). ADR 006.
; FPM-only hardening (disable_functions, ...) lives in fpm/zz-wave.conf so the
; worker keeps proc_open for ffmpeg.
expose_php = Off
memory_limit = 256M
max_execution_time = 30
date.timezone = UTC

; Uploads (D4): 30 MB file, 32 MB body, 2 files per request.
post_max_size = 32M
upload_max_filesize = 30M
max_file_uploads = 2

allow_url_include = Off
session.use_strict_mode = 1
session.upload_progress.enabled = 0

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; 1 in dev (compose override), 0 in prod (image default).
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
realpath_cache_size = 4096K
realpath_cache_ttl = 600
