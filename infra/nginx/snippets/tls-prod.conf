# Prod TLS termination (F4) — NOT included in dev. Use it either:
#  a) here: add a `listen 8443 ssl;` server reusing wave.conf's locations, with
#     certificates mounted read-only, and redirect plain HTTP to HTTPS; or
#  b) on a load balancer in front of nginx: then set TRUSTED_PROXIES to the LB
#     address only, and use `set_real_ip_from <LB>; real_ip_header X-Forwarded-For;`
#     so $remote_addr (passed to PHP as X-Forwarded-For) is the real client.
# REFRESH_COOKIE_SECURE must be 1 in prod: the backend refuses to boot otherwise.
#
# listen 8443 ssl;
# http2 on;
# ssl_certificate     /etc/nginx/tls/fullchain.pem;
# ssl_certificate_key /etc/nginx/tls/privkey.pem;
# ssl_protocols TLSv1.2 TLSv1.3;
# ssl_prefer_server_ciphers off;
# ssl_session_cache shared:SSL:10m;
# ssl_session_tickets off;

# HSTS: security-headers.conf already sends it on every response served over
# https (map $hsts_header in nginx.conf). With option b), add HSTS on the LB.
