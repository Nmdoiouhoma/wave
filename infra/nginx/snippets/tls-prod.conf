# TLS parameters of the deployed edge (tls/wave.conf). Certificates are
# copied by the certbot deploy hook (infra/deploy/certbot-deploy-hook.sh) to
# /etc/wave/tls, readable by nginx's uid 101 (Let's Encrypt keys are root-only).
# HSTS is sent by security-headers.conf on every https response ($hsts_header
# map in nginx.conf). REFRESH_COOKIE_SECURE must be 1 (the backend refuses to
# boot in prod otherwise).
ssl_certificate     /etc/wave/tls/fullchain.pem;
ssl_certificate_key /etc/wave/tls/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:5m;
ssl_session_timeout 1d;
ssl_session_tickets off;
