# Front controller only: every /api/ request goes to public/index.php, no file
# from the request path is ever executed.
include fastcgi_params;
set $php_upstream php:9000;
fastcgi_pass $php_upstream;
fastcgi_param SCRIPT_FILENAME /app/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /app/public;
fastcgi_param HTTP_PROXY "";
# nginx is the edge: client-supplied forwarding headers are never passed on
# (F1). REMOTE_ADDR is already the real peer, so TRUSTED_PROXIES stays empty;
# these values are only ever nginx's own view of the request.
fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
fastcgi_param HTTP_X_FORWARDED_PORT "";
fastcgi_param HTTP_FORWARDED "";
fastcgi_param HTTP_CLIENT_IP "";
fastcgi_param HTTP_X_REAL_IP "";
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
fastcgi_read_timeout 65s;
fastcgi_hide_header X-Powered-By;

include /etc/nginx/snippets/security-headers.conf;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
