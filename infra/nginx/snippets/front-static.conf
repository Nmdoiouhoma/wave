# Prod: built SPA (frontend `npm run build` output mounted at /srv/front).
location / {
    root /srv/front;
    try_files $uri /index.html;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}

location /assets/ {
    root /srv/front;
    expires 1y;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
