# Deployed edge with TLS (compose.small.yaml mounts this file over
# /etc/nginx/conf.d/wave.conf). Host 80 -> 8080, 443 -> 8443.

# Plain HTTP: ACME challenges (certbot --webroot), container healthcheck,
# everything else redirected to https.
server {
    listen 8080 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    include /etc/nginx/snippets/tls-prod.conf;
    include /etc/nginx/snippets/wave-locations.conf;
}
