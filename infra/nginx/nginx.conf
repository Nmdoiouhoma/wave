# Wave nginx (runs unprivileged as uid 101, read-only root FS).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time '
                    'cache=$upstream_cache_status';
    # Never log query strings of signed stream URLs: $request contains only the
    # path for /api/v1/stream/{token}; the token is a bearer for <= 5 min.
    access_log /dev/stdout main;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Default body limit; upload routes raise it (ADR 006).
    client_max_body_size 1m;
    client_body_buffer_size 128k;

    # Docker embedded DNS: lets upstreams referenced through variables
    # (php, front) be down at startup without nginx failing to boot.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Audio cache (ADR 001): keyed by object key + slice range, shared by all
    # listeners. Lives on the nginx_cache volume, never under a served root.
    proxy_cache_path /var/cache/nginx/audio levels=1:2 keys_zone=audio:20m
                     max_size=2g inactive=7d use_temp_path=off;
    # Public media (immutable, versioned keys).
    proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:10m
                     max_size=1g inactive=30d use_temp_path=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
