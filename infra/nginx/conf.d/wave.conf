# Wave edge server (ADR 001, ADR 006). Container port 8080, published on the
# host as ${WAVE_HTTP_PORT} (8090 in dev).

server {
    listen 8080 default_server;
    server_name _;

    # ---------------------------------------------------------------- API ---
    # Upload routes get a larger body limit; everything else under /api/ keeps
    # the 1m default from nginx.conf. Above the limit nginx answers a bare 413
    # (CONVENTIONS §5: clients map any 413 to payload_too_large).

    # Track audio no longer goes through PHP (ADR 009: presigned POST to
    # /upload/wave-private), so POST /api/v1/tracks keeps the 1m default.
    # Post uploads (visual <= 15 MB + multipart overhead).
    location = /api/v1/posts {
        client_max_body_size 32m;
        include /etc/nginx/snippets/fpm.conf;
    }

    # Avatar and cover uploads (images <= 5 MB).
    location = /api/v1/me/avatar {
        client_max_body_size 6m;
        include /etc/nginx/snippets/fpm.conf;
    }
    location ~ ^/api/v1/artists/[^/]+/avatar$ {
        client_max_body_size 6m;
        include /etc/nginx/snippets/fpm.conf;
    }
    location ~ ^/api/v1/tracks/[^/]+/cover$ {
        client_max_body_size 6m;
        include /etc/nginx/snippets/fpm.conf;
    }

    # Signed stream URLs: PHP validates the token, then X-Accel-Redirect to
    # /_protected/private/{audioKey}. ^~ so no regex location can capture it.
    location ^~ /api/v1/stream/ {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/fpm.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/fpm.conf;
    }

    # ----------------------------------------------- direct audio upload ---
    # ADR 009: the browser POSTs the presigned S3 form here; MinIO checks the
    # signed policy (exact key, size range, expiry). POST to this exact path
    # only: nginx's `storage` address may read private audio anonymously
    # (ADR 001), so this location goes through the `internal` network
    # (`minio-internal`, no anonymous read) and never accepts GET/HEAD.
    location = /upload/wave-private {
        limit_except POST { deny all; }
        # No query string: no S3 sub-resource (?delete, ?uploads, ...).
        if ($args != "") {
            return 404;
        }

        client_max_body_size 201m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host minio-internal:9000;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_pass http://minio-internal:9000/wave-private;

        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header Server;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Xss-Protection;
        proxy_hide_header X-Ratelimit-Limit;
        proxy_hide_header X-Ratelimit-Remaining;
        proxy_hide_header Vary;

        # GET/HEAD/PUT... denied (403) -> bare 404, like any unknown path.
        error_page 403 = @not_found;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Every other path under /upload/ (and the bucket path with a suffix).
    location ^~ /upload/ {
        return 404;
    }

    # ------------------------------------------------------ private audio ---
    # Reachable only through X-Accel-Redirect: a direct request gets 404.
    location /_protected/private/ {
        internal;

        slice 1m;
        proxy_cache audio;
        proxy_cache_key $uri$slice_range;
        proxy_cache_valid 200 206 7d;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;

        proxy_set_header Range $slice_range;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host minio-edge:9000;
        # Never forward client credentials to the object store.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_pass http://minio-edge:9000/wave-private/;

        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header X-Amz-Server-Side-Encryption;
        proxy_hide_header Accept-Ranges;
        proxy_hide_header Server;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Xss-Protection;
        proxy_hide_header X-Ratelimit-Limit;
        proxy_hide_header X-Ratelimit-Remaining;
        proxy_hide_header Vary;

        # Missing object / denied by bucket policy: bare 404, no S3 XML.
        proxy_intercept_errors on;
        error_page 403 404 = @not_found;

        include /etc/nginx/snippets/security-headers.conf;
        # Cache-Control comes from the PHP stream response ("max-age=300,
        # private"): nginx carries it over the X-Accel redirect and
        # fastcgi_hide_header cannot drop it, so adding one here would duplicate it.
        add_header Accept-Ranges bytes always;
    }

    # Anything else under /_protected/ (no front fallback either).
    location ^~ /_protected/ {
        return 404;
    }

    # ------------------------------------------------------- public media ---
    # Read-only view of the wave-public bucket. Keys are versioned (uuid) and
    # never overwritten, hence immutable caching. Query strings are dropped so
    # no S3 sub-resource or response-* override can reach MinIO.
    location /media/ {
        limit_except GET { deny all; }

        rewrite ^/media/(.+)$ /wave-public/$1? break;
        proxy_pass http://minio-edge:9000;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host minio-edge:9000;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_cache media;
        proxy_cache_key $uri;
        proxy_cache_valid 200 30d;
        # Videos (posts) need Range for seeking: served from the cached object.
        proxy_force_ranges on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;

        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header Server;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Xss-Protection;
        proxy_hide_header X-Ratelimit-Limit;
        proxy_hide_header X-Ratelimit-Remaining;
        proxy_hide_header Vary;

        proxy_intercept_errors on;
        error_page 400 403 404 = @not_found;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /media/ {
        return 404;
    }

    location @not_found {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------- front ---
    # Dev: Vite dev server (front-dev.conf); prod: static build (front-static.conf).
    include /etc/nginx/wave/front.conf;
}
